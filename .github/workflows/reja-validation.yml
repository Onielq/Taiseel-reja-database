name: REJA validation

on:
  push:
    branches:
      - feature/market-intelligence-dxb-model
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: REJA-SQL-World-Class/package-lock.json
      - name: Install dependencies
        working-directory: REJA-SQL-World-Class
        run: npm ci
      - name: Validate source and tests
        working-directory: REJA-SQL-World-Class
        run: npm run check
