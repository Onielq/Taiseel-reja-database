name: REJA validation

on:
  push:
    branches:
      - feature/market-intelligence-dxb-model
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://reja@127.0.0.1:5432/reja
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: reja
          POSTGRES_DB: reja
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reja -d reja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: REJA-SQL-World-Class/package-lock.json
      - name: Install dependencies
        working-directory: REJA-SQL-World-Class
        run: npm ci
      - name: Validate source and tests
        working-directory: REJA-SQL-World-Class
        run: npm run check
      - name: Prepare local environment
        working-directory: REJA-SQL-World-Class
        run: cp .env.example .env
      - name: Apply PostgreSQL migrations
        working-directory: REJA-SQL-World-Class
        run: npm run migrate
      - name: Smoke-test the source-aware market importer
        working-directory: REJA-SQL-World-Class
        run: |
          printf '%s' '{"source":{"sourceKey":"ci-market-smoke-source","sourceUrl":"https://example.invalid/ci-market-test","title":"CI-only schema smoke test","publisher":"Automated test","purpose":"Temporary rows for an isolated CI database only","sourceType":"user_supplied","payload":{}},"properties":[{"externalId":"CI-PROPERTY-001","propertyType":"apartment","district":"CI Test District","sector":"CI Test Sector","buildingName":"CI Fixture Building","unitLabel":"CI-001","internalAreaSqm":"80.00","payload":{}}],"transactions":[{"sourceRecordKey":"CI-TRANSACTION-001","propertyExternalId":"CI-PROPERTY-001","transactionType":"sale","transactionDate":"2026-01-15","amount":"100000","currency":"RWF","rentPeriod":"not_applicable","propertyType":"apartment","district":"CI Test District","sector":"CI Test Sector","propertyAreaSqm":"80.00","verificationStatus":"unverified","payload":{}}],"listings":[{"sourceRecordKey":"CI-LISTING-001","propertyExternalId":"CI-PROPERTY-001","listingType":"sale","askingAmount":"125000","currency":"RWF","rentPeriod":"not_applicable","propertyType":"apartment","district":"CI Test District","sector":"CI Test Sector","propertyAreaSqm":"80.00","listingUrl":"https://example.invalid/ci-listing/1","listingStatus":"active","payload":{}}]}' > /tmp/market-smoke-snapshot.json
          npm run market:import -- /tmp/market-smoke-snapshot.json
      - name: Smoke-test market read APIs
        working-directory: REJA-SQL-World-Class
        run: |
          npm start > /tmp/reja-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health > /tmp/reja-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/reja-health.json
          curl -fsS http://127.0.0.1:8787/api/v1/market/summary > /tmp/reja-market-summary.json
          grep -q '"verified_transaction_count":0' /tmp/reja-market-summary.json
          grep -q '"active_listing_count":1' /tmp/reja-market-summary.json
          curl -fsS 'http://127.0.0.1:8787/api/v1/market/transactions?type=sale&propertyType=apartment&currency=RWF' > /tmp/reja-market-transactions.json
          grep -q '"total":0' /tmp/reja-market-transactions.json
          curl -fsS 'http://127.0.0.1:8787/api/v1/market/listings?type=sale&propertyType=apartment&currency=RWF' > /tmp/reja-market-listings.json
          grep -q '"total":1' /tmp/reja-market-listings.json
          curl -fsS http://127.0.0.1:8787/market | grep -q 'Know what properties'
