<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>REJA — Rwanda Real Estate Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* direction: SIGNAL ROOM — institutional intelligence desk. Graphite ground, one
   amber signal accent doing all the emphasis work, IBM Plex Mono for every number.
   rules: no gradients on surfaces; hierarchy via size/weight/tracking only; hover
   states lift and brighten, never add shadow-soup.
   signature: a growing amber ledger-rule under headings, active nav and active tabs —
   the same 2px accent used everywhere motion needs to draw the eye. */
:root{
  --bg:#0a0c0e;
  --bg-raised:#101316;
  --panel:#13171b;
  --panel-2:#181d22;
  --line:#22282d;
  --line-strong:#333b42;
  --ink:#eceeef;
  --ink-soft:#a4adb3;
  --ink-faint:#8f999f;
  --signal:#d99a4e;
  --signal-soft:#8a662f;
  --signal-dim:#3a2e1c;
  --good:#5fae76;
  --warn:#b9c24a;
  --bad:#c76449;
  --crit:#e0503a;
  --info:#5a9cba;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --font-sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:16px; --fs-xl:26px;
  --r:4px;
  /* motion tokens */
  --motion-fast:120ms;
  --motion-base:200ms;
  --motion-slow:320ms;
  --ease-standard:cubic-bezier(0.2,0,0,1);
  --ease-decelerate:cubic-bezier(0,0,0,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  /* spacing scale (4px base) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:var(--fs-md);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--signal);color:#0a0c0e;}
a{color:var(--info);text-decoration:none;transition:color var(--motion-fast) var(--ease-standard);}
a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--signal-soft);}
::-webkit-scrollbar-track{background:var(--bg);}
.mono{font-family:var(--font-mono);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms !important;transition-duration:80ms !important;}
}

/* ---------- entrance motion (signature move: the ledger-rule) ---------- */
@keyframes viewRise{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
#main.view-enter{animation:viewRise var(--motion-slow) var(--ease-decelerate) both;}
@keyframes ledgerGrow{ from{width:0;} to{width:34px;} }
.pagehead h1{position:relative;padding-bottom:11px;}
.pagehead h1::after{
  content:"";position:absolute;left:0;bottom:0;height:2px;width:34px;background:var(--signal);
  animation:ledgerGrow var(--motion-slow) var(--ease-decelerate) both;animation-delay:60ms;
}
.section-title{position:relative;}

/* ---------- shell layout ---------- */
#shell{display:grid;grid-template-columns:222px 1fr;min-height:100vh;}
#nav{
  background:var(--bg-raised);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;padding:20px 0 var(--sp-4);
}
#nav .brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:12px;}
#nav .brand .mark{font-family:var(--font-mono);font-weight:700;font-size:var(--fs-xl);letter-spacing:.01em;color:var(--ink);}
#nav .brand .sub{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:4px;letter-spacing:.07em;text-transform:uppercase;}
#nav nav{display:flex;flex-direction:column;gap:1px;padding:var(--sp-2) 10px;}
#nav nav a{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r);
  color:var(--ink-soft);font-size:var(--fs-md);font-weight:500;position:relative;
  transition:background var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard),padding-left var(--motion-base) var(--ease-standard);
}
#nav nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none;}
#nav nav a.active{background:var(--panel-2);color:var(--ink);font-weight:600;}
#nav nav a.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--signal);
  border-radius:0 2px 2px 0;
}
#nav .footer-note{margin-top:auto;padding:var(--sp-4) 18px 0;font-size:var(--fs-xs);color:var(--ink-faint);border-top:1px solid var(--line);line-height:1.6;}

#main{min-width:0;padding:24px 32px 64px;max-width:1320px;}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.pagehead h1{font-size:var(--fs-xl);margin:0;font-weight:700;letter-spacing:-.015em;}
.pagehead .desc{color:var(--ink-soft);font-size:var(--fs-sm);margin-top:8px;max-width:640px;line-height:1.6;}
.crumb{font-size:var(--fs-xs);color:var(--ink-faint);margin-bottom:8px;font-family:var(--font-mono);letter-spacing:.02em;}
.crumb a{color:var(--ink-faint);}
.crumb a:hover{color:var(--ink-soft);}

/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:17px;transition:border-color var(--motion-base) var(--ease-standard);}
.panel + .panel{margin-top:14px;}
.section-title{font-size:var(--fs-xs);letter-spacing:.08em;color:var(--ink-faint);margin:0 0 12px;font-weight:600;text-transform:uppercase;}
.hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);
  border:1px solid var(--line-strong);color:var(--ink);padding:7px 12px;border-radius:var(--r);
  font-size:var(--fs-sm);cursor:pointer;font-weight:500;
  transition:border-color var(--motion-fast) var(--ease-standard),background var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard);
}
.btn:hover{border-color:var(--signal);color:var(--ink);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#0a0c0e;font-weight:600;}
.btn.primary:hover{background:var(--signal);}
.btn.ghost{background:transparent;}
.btn.small{padding:4px 9px;font-size:var(--fs-xs);}
input[type=text],input[type=number],select,textarea{
  background:var(--bg-raised);border:1px solid var(--line-strong);color:var(--ink);
  padding:8px 10px;border-radius:var(--r);font-size:var(--fs-sm);font-family:var(--font-sans);width:100%;
  transition:border-color var(--motion-fast) var(--ease-standard);
}
input:focus,select:focus,textarea:focus{border-color:var(--signal);}
label.field{display:block;font-size:var(--fs-xs);color:var(--ink-faint);letter-spacing:.04em;margin-bottom:5px;text-transform:uppercase;}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:2.5px 8px;border-radius:20px;border:1px solid var(--line-strong);color:var(--ink-soft);font-weight:500;white-space:nowrap;}
.tag.verified{color:var(--good);border-color:#2b4331;background:#101d13;}
.tag.unverified{color:var(--warn);border-color:#453a1c;background:#1e190d;}
.tag.unknown{color:var(--ink-faint);border-color:var(--line-strong);}
.tag.conflict{color:var(--bad);border-color:#432420;background:#20130f;}
.risk-LOW{color:var(--good);}
.risk-MEDIUM{color:var(--warn);}
.risk-HIGH{color:var(--bad);}
.risk-CRITICAL{color:var(--crit);font-weight:700;}
.pill-risk{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;}
.pill-risk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;}

.opp-HIGH{color:var(--good);}
.opp-MEDIUM{color:var(--warn);}
.opp-LOW{color:var(--ink-faint);}
.pill-opp{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.02em;}
.pill-opp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;}
.tag.illustrative{color:var(--info);border-color:#1d3a47;background:#0d1f26;}

.paystrip{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 6px;}
.paystrip .block{flex:1 0 64px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:6px;padding:9px 6px;text-align:center;}
.paystrip .block.milestone{border-color:var(--signal-soft);}
.paystrip .block .pct{font-family:var(--font-mono);font-size:var(--fs-lg);font-weight:700;color:var(--ink);}
.paystrip .block .lbl{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:3px;line-height:1.3;}
.mkt-position{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.mkt-position .big{font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:700;color:var(--ink);}
.mkt-position .delta{font-family:var(--font-mono);font-size:var(--fs-md);font-weight:600;}

.statbar{width:100%;height:5px;background:var(--bg-raised);border-radius:3px;overflow:hidden;border:1px solid var(--line);}
.statbar > span{display:block;height:100%;background:var(--signal);transition:width var(--motion-slow) var(--ease-decelerate);}

table.datatable{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
table.datatable th{
  text-align:left;font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;
  padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--panel);
  transition:color var(--motion-fast) var(--ease-standard);
}
table.datatable th:hover{color:var(--signal);}
table.datatable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.datatable tbody tr{cursor:pointer;transition:background var(--motion-fast) var(--ease-standard);}
table.datatable tbody tr:hover{background:var(--panel-2);}
.thumb{width:38px;height:28px;border-radius:2px;background:var(--bg-raised);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--ink-faint);text-align:center;line-height:1.1;flex-shrink:0;}

.kpi{display:flex;flex-direction:column;gap:3px;}
.kpi .v{font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.kpi .l{font-size:var(--fs-xs);color:var(--ink-faint);letter-spacing:.03em;}
.panel.kpi{transition:border-color var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-standard);}
.panel.kpi:hover{border-color:var(--line-strong);transform:translateY(-1px);}

.feed-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:6px;height:6px;border-radius:50%;background:var(--signal);margin-top:6px;flex-shrink:0;}
.feed-title{font-size:var(--fs-sm);color:var(--ink);}
.feed-meta{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:3px;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tabs button{background:transparent;border:none;color:var(--ink-faint);padding:10px 14px;font-size:var(--fs-sm);font-weight:500;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color var(--motion-fast) var(--ease-standard),border-color var(--motion-base) var(--ease-standard);}
.tabs button:hover{color:var(--ink-soft);}
.tabs button.active{color:var(--ink);border-bottom-color:var(--signal);}

.dossier-head{display:grid;grid-template-columns:180px 1fr;gap:22px;margin-bottom:20px;}
.dossier-img{width:180px;height:135px;border:1px dashed var(--line-strong);border-radius:7px;background:var(--bg-raised);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-size:var(--fs-xs);text-align:center;padding:10px;}
.factgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
@media (max-width:1100px){.factgrid{grid-template-columns:repeat(3,1fr);}}
.factgrid .kpi .v{font-size:var(--fs-lg);}

.evrow{display:grid;grid-template-columns:150px 1fr 100px;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);align-items:center;}
.evrow:last-child{border-bottom:none;}
.evrow .k{color:var(--ink-faint);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.03em;}

.node-card{border:1px solid var(--line-strong);border-radius:7px;padding:11px 13px;background:var(--panel-2);cursor:pointer;
  transition:border-color var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard);}
.node-card:hover{border-color:var(--signal);transform:translateY(-1px);}
.node-card .t{font-size:var(--fs-sm);font-weight:600;color:var(--ink);}
.node-card .s{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:3px;}

.callout{border:1px solid var(--line-strong);border-left:3px solid var(--signal);background:var(--panel-2);border-radius:5px;padding:11px 13px;font-size:var(--fs-sm);color:var(--ink-soft);}
.callout.warn{border-left-color:var(--warn);}
.callout.bad{border-left-color:var(--bad);}
.callout.good{border-left-color:var(--good);}

.emptystate{padding:34px 10px;text-align:center;color:var(--ink-faint);font-size:var(--fs-sm);}
.searchbar{display:flex;gap:8px;}
.searchbar input{font-family:var(--font-mono);font-size:var(--fs-md);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.chip{font-size:var(--fs-xs);padding:3.5px 9px;border-radius:20px;background:var(--signal-dim);border:1px solid var(--signal-soft);color:var(--signal);font-family:var(--font-mono);}

.calc-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;}
@media (max-width:900px){.calc-grid{grid-template-columns:1fr;}}
.result-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);}
.result-line .l{color:var(--ink-faint);}
.result-line .v{font-family:var(--font-mono);font-weight:600;}
.scenario-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
.scenario-table th,.scenario-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-mono);}
.scenario-table th:first-child,.scenario-table td:first-child{text-align:left;font-family:var(--font-sans);}
.scenario-table th{color:var(--ink-faint);font-size:var(--fs-xs);text-transform:uppercase;font-weight:500;}

.checklist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);}
.checklist-item select{width:140px;}
.svglink{stroke:var(--line-strong);stroke-width:1.2;}
.svgnode{fill:var(--panel-2);stroke:var(--line-strong);transition:stroke var(--motion-base) var(--ease-standard);}
.svgnode.center{stroke:var(--signal);}
.svgtext{fill:var(--ink);font-size:var(--fs-xs);font-family:var(--font-sans);}
.svgtext.dim{fill:var(--ink-faint);font-size:var(--fs-xs);}

.signal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.signal-box{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 14px;}
.signal-box .big{font-family:var(--font-mono);font-size:20px;font-weight:700;}
.signal-box .label{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:3px;}
.rank-row{display:grid;grid-template-columns:minmax(160px,1fr) 90px 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-row .name{font-weight:600;}
.rank-row .meta{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:2px;}
@media (max-width:900px){.signal-grid{grid-template-columns:1fr 1fr;}}

@media (max-width:820px){
  #shell{grid-template-columns:1fr;}
  #nav{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px;}
  #nav .brand{border:none;padding:0 10px 0 0;margin:0;}
  #nav nav{flex-direction:row;flex-wrap:wrap;padding:0;}
  #nav .footer-note{display:none;}
  .factgrid{grid-template-columns:repeat(2,1fr);}
  .dossier-head{grid-template-columns:1fr;}
}

.pill-risk.risk-HIGH::before{background:transparent;border:1px solid currentColor;box-sizing:border-box;}
.pill-risk.risk-CRITICAL::before{border-radius:1px;}
.coverage-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 13px;border:1px solid var(--line-strong);border-left:3px solid var(--signal);background:var(--panel-2);border-radius:5px;color:var(--ink-soft);font-size:var(--fs-xs);margin:0 0 14px;}
/* ---------- editorial property dossier architecture ---------- */
.dossier-index{
  display:flex;align-items:center;gap:0;white-space:nowrap;overflow-x:auto;
  padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin:0 0 20px;color:var(--ink-faint);font-size:var(--fs-xs);font-family:var(--font-mono);
}
.dossier-index a{color:var(--ink-faint);padding:0 9px;}
.dossier-index a:first-child{padding-left:0;}
.dossier-index a:hover{color:var(--signal);text-decoration:none;}
.dossier-index .sep{color:var(--line-strong);}
.dossier-hero{
  display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:stretch;margin-bottom:20px;
}
.dossier-photo{
  min-height:164px;border:1px dashed var(--line-strong);border-radius:7px;background:var(--bg-raised);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--ink-faint);font-size:var(--fs-xs);padding:14px;
}
.dossier-photo strong{display:block;color:var(--ink-soft);font-family:var(--font-mono);font-size:var(--fs-sm);margin-bottom:5px;}
.dossier-lead-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:11px;}
.dossier-lead-box{background:var(--panel);border:1px solid var(--line);padding:13px 14px;min-height:76px;}
.dossier-lead-box .value{font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:700;line-height:1.1;}
.dossier-lead-box .label{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:7px;}
.dossier-meta-line{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-faint);margin-bottom:10px;}
.dossier-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dossier-stat{padding:10px 11px;background:var(--panel-2);border:1px solid var(--line);}
.dossier-stat .v{font-family:var(--font-mono);font-size:var(--fs-lg);font-weight:700;line-height:1.1;}
.dossier-stat .l{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:4px;}
.dossier-section{padding:20px 0;border-top:1px solid var(--line);scroll-margin-top:18px;}
.dossier-section:first-of-type{border-top:0;padding-top:0;}
.dossier-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:12px;}
.dossier-section-head h2{font-size:16px;margin:0;letter-spacing:-.01em;}
.dossier-section-head p{margin:0;color:var(--ink-faint);font-size:var(--fs-xs);max-width:620px;text-align:right;}
.dossier-inline{display:flex;align-items:center;flex-wrap:wrap;gap:7px 18px;font-size:12.5px;line-height:1.55;}
.dossier-inline .item{display:flex;gap:6px;align-items:baseline;min-width:0;}
.dossier-inline .k{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}
.dossier-inline .v{color:var(--ink);font-weight:500;}
.dossier-module-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;}
.dossier-module{min-width:0;}
.dossier-subhead{font-size:var(--fs-sm);font-weight:600;color:var(--ink-soft);margin-bottom:9px;letter-spacing:.03em;text-transform:uppercase;}
.dossier-rule-list{display:flex;flex-direction:column;gap:0;}
.dossier-rule{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:12px;}
.dossier-rule:last-child{border-bottom:0;}
.dossier-rule .k{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.035em;}
.dossier-chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.dossier-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--panel-2);font-size:var(--fs-xs);color:var(--ink-soft);}
.dossier-chip.good{border-color:#2b4331;color:var(--good);}
.dossier-chip.warn{border-color:#5b5f27;color:var(--warn);}
.dossier-chip.bad{border-color:#432420;color:var(--bad);}
.dossier-chip.muted{color:var(--ink-faint);}
.dossier-coverage{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 13px;background:var(--panel-2);border-left:3px solid var(--signal);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:12px;font-size:var(--fs-xs);}
.dossier-coverage strong{font-family:var(--font-mono);color:var(--ink);}
.dossier-timeline{display:flex;gap:0;overflow-x:auto;padding:6px 0 4px;}
.dossier-event{min-width:160px;flex:1;border-top:2px solid var(--line-strong);padding:10px 14px 0 0;margin-right:14px;position:relative;}
.dossier-event::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--signal);}
.dossier-event .year{font-family:var(--font-mono);font-size:var(--fs-sm);font-weight:700;}
.dossier-event .desc{font-size:12px;color:var(--ink-soft);line-height:1.45;margin-top:4px;}
.dossier-event .src{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:4px;}
.dossier-table{width:100%;border-collapse:collapse;font-size:12px;}
.dossier-table th{padding:8px 9px;text-align:left;color:var(--ink-faint);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line-strong);}
.dossier-table td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle;}
.dossier-table td.num{text-align:right;}
.dossier-market-grid{display:grid;grid-template-columns:1.6fr .85fr;gap:20px;align-items:start;}
.dossier-opportunity{background:var(--panel-2);border:1px solid var(--line);padding:15px;}
.dossier-opportunity .num{font-family:var(--font-mono);font-size:30px;font-weight:700;}
.dossier-score-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.dossier-score{background:var(--panel);border:1px solid var(--line);padding:14px;}
.dossier-score .headline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}
.dossier-score .headline .n{font-family:var(--font-mono);font-size:22px;font-weight:700;}
.dossier-score .headline .l{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.dossier-source-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;}
.dossier-source-line:last-child{border-bottom:0;}
.dossier-source-line .label{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.dossier-gapline{display:flex;gap:8px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;}
.dossier-gapline:last-child{border-bottom:0;}
.dossier-gapline .bullet{width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:5px;flex:none;}
.dossier-conflicts{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
.dossier-conflict{padding:9px 11px;border-left:3px solid var(--bad);background:var(--panel-2);font-size:12px;color:var(--ink-soft);}
.dossier-note{font-size:var(--fs-xs);color:var(--ink-faint);line-height:1.55;}
.dossier-mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px;}
.dossier-mini-kpi{padding:10px;background:var(--panel-2);border:1px solid var(--line);}
.dossier-mini-kpi .v{font-family:var(--font-mono);font-size:15px;font-weight:700;}
.dossier-mini-kpi .l{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:4px;}
@media (max-width:900px){
  .dossier-hero,.dossier-module-grid,.dossier-market-grid,.dossier-score-grid{grid-template-columns:1fr;}
  .dossier-stat-row,.dossier-mini-kpis{grid-template-columns:repeat(2,1fr);}
  .dossier-section-head{align-items:flex-start;flex-direction:column;}
  .dossier-section-head p{text-align:left;}
}
@media (max-width:620px){
  .dossier-lead-row{grid-template-columns:1fr;}
  .dossier-stat-row,.dossier-mini-kpis{grid-template-columns:1fr 1fr;}
  .dossier-rule{grid-template-columns:1fr;gap:3px;}
}

.coverage-strip strong{color:var(--ink);font-family:var(--font-mono);}
.evidence-verified{color:var(--ink);}
.evidence-unverified{text-decoration-line:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.evidence-unknown{color:var(--ink-faint);background-image:repeating-linear-gradient(135deg,transparent 0,transparent 2px,rgba(143,153,159,.12) 2px,rgba(143,153,159,.12) 4px);}
.dossier-meta{margin-top:10px;font:var(--fs-xs)/1.4 var(--font-mono);color:var(--ink-faint);}
.chart{display:flex;flex-direction:column;gap:8px;}
.chart-row{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:8px;font-size:var(--fs-xs);}
.chart-bar{height:8px;background:var(--bg-raised);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.chart-bar span{display:block;height:100%;background:var(--signal);}

<script id="reja-data" type="application/json">{"projects":[],"segments":[],"developers":[],"sources":[],"ownerGroups":{}}</script>
<script>(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('reja-data').textContent);
var PROJECTS = DATA.projects || [], SEGMENTS = DATA.segments || [], DEVELOPERS = DATA.developers || [], SOURCES = DATA.sources || [], OWNER_GROUPS = DATA.ownerGroups || {};
var byId = {}; PROJECTS.forEach(function(p){ byId[p.id] = p; });
var devById = {}; DEVELOPERS.forEach(function(d){ devById[d.id] = d; });

// ---------------- session state (in-memory only; resets on reload) ----------------
var STATE = {
  watchProps: [], watchDevs: [],
  cases: [], // {id, title, targetId, targetType, status, tasks:[{label,status,notes}], notes, created}
  caseSeq: 1
};
var DEFAULT_DD = ['Title & Ownership','Encumbrances','Land & Parcel','Planning & Zoning','Permits','Environment','Financing','Leases & Tenants','Valuation','Legal / Corporate'];

// ---------------- utils ----------------
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(v){ return (v===null||v===undefined||v==='') ? '—' : v; }
function fmtNum(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }
function fmtPct(n,d){ if(n===null||n===undefined||isNaN(n)) return '—'; return n.toFixed(d===undefined?1:d)+'%'; }
function yearOf(s){ if(!s) return null; var m = String(s).match(/(20\d{2})/); return m ? parseInt(m[1],10) : null; }
function statusTag(status){
  var s = status ? status.toLowerCase() : '';
  var cls = 'unknown';
  if (s.indexOf('to verify')>=0) cls='unverified';
  else if (s.indexOf('stall')>=0) cls='conflict';
  else if (s) cls='verified';
  return '<span class="tag '+cls+'">'+esc(status||'UNKNOWN')+'</span>';
}
function fieldTag(fstatus){
  return '<span class="tag '+fstatus+'">'+fstatus.toUpperCase()+'</span>';
}
function riskPill(level, score){var safe=level||'UNKNOWN';return '<span class="pill-risk risk-'+esc(safe)+'">'+esc(safe)+' <span class="num" style="color:var(--ink-faint)">('+(score===null||score===undefined?'—':esc(score))+')</span></span>';}
function confBar(v){
  if(typeof v!=='number'||!Number.isFinite(v)) return '<span class="tag unknown">UNKNOWN</span>';
  var safe=Math.max(0,Math.min(100,v));
  return '<div style="display:flex;align-items:center;gap:8px;"><div class="statbar" style="width:60px;"><span style="width:'+safe+'%"></span></div><span class="num" style="font-size:var(--fs-xs);color:var(--ink-soft)">'+safe+'</span></div>';
}
function sourceTier(url){
  if(!url) return {t:'D',label:'No source on file'};
  try{var host=new URL(String(url)).hostname.toLowerCase().replace(/^www\./,'');
    if(host.endsWith('.gov.rw')) return {t:'A',label:'Official / government source'};
    if(host==='newtimes.co.rw'||host.endsWith('.newtimes.co.rw')||host==='visionmedia.rw'||host.endsWith('.visionmedia.rw')) return {t:'B',label:'Established news organisation'};
    return {t:'C',label:'Developer / marketing website'};
  }catch(e){return {t:'D',label:'Invalid / unsupported source URL'};}
}
function safeSourceURL(url){try{var u=new URL(String(url));return (u.protocol==='http:'||u.protocol==='https:')?u.href:null;}catch(e){return null;}}
function sourceLink(url,label){var safe=safeSourceURL(url);return safe?'<a href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">'+esc(label||safe)+'</a>':esc(label||url||'No source');}
function evidenceValue(value,status,display){var cls=status==='verified'?'evidence-verified':(status==='unverified'?'evidence-unverified':'evidence-unknown');return '<span class="'+cls+'">'+esc(String(display!==undefined?display:fmt(value)))+'</span>';}
function riskReasonTotal(p){return (p.riskReasons||[]).reduce(function(a,r){return a+(Number(r[1])||0);},0);}
function isOpportunityFlag(p){var st=(p.status||'').toLowerCase();return st.indexOf('stall')>=0||st.indexOf('developer changed')>=0||st.indexOf('ownership changed')>=0;}
function unitsSummary(list){var known=0,unknown=0;list.forEach(function(p){if(typeof p.units==='number')known+=p.units;else unknown++;});return {known:known,unknown:unknown};}
function evidenceCoverage(list){var total=0,verified=0,unknown=0,unverified=0;list.forEach(function(p){Object.keys(p.fields||{}).forEach(function(k){total++;var st=p.fields[k].status;if(st==='verified')verified++;else if(st==='unknown')unknown++;else unverified++;});});return {total:total,verified:verified,unknown:unknown,unverified:unverified,pct:total?Math.round(verified/total*100):0};}
function unitsLabel(list){var x=unitsSummary(list);return x.known?fmtNum(x.known)+(x.unknown?' + '+x.unknown+' unknown':''):(x.unknown?'UNKNOWN':'—');}
function developerDeliveryScore(d,projs){var completed=projs.filter(function(p){var st=(p.status||'').toLowerCase();return st.indexOf('completed')>=0||st.indexOf('occupied')>=0||st.indexOf('delivered')>=0;}).length;var flagged=projs.filter(isOpportunityFlag).length;if(!projs.length||completed===0)return null;return Math.max(0,Math.round(100*(completed/projs.length)-Math.min(40,100*(flagged/projs.length))));}
function go(hash){ location.hash = hash; }
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

// ---------------- unit economics engine ----------------
// Mirrors the computeUnderwriting()/solveIRR() pattern: pure functions, never
// invent a number — return null when the inputs aren't there, and let the
// caller render DATA GAP rather than guess.
function calcPricePerM2(price, sizeM2){
  if (typeof price!=='number' || typeof sizeM2!=='number' || !sizeM2) return null;
  return price/sizeM2;
}
function calcAreaEfficiency(saleableM2, gbaM2){
  if (typeof saleableM2!=='number' || typeof gbaM2!=='number' || !gbaM2) return null;
  return saleableM2/gbaM2;
}
function unitMixSummary(p){
  if (!p.unitMix || !p.unitMix.length) return null;
  var totalUnits = 0, weightedPpsm = 0, weightedUnits = 0;
  var rows = p.unitMix.map(function(u){
    var sizeAvg = (typeof u.sizeMinM2==='number' && typeof u.sizeMaxM2==='number') ? (u.sizeMinM2+u.sizeMaxM2)/2 : (u.sizeMinM2||u.sizeMaxM2||null);
    var ppsm = calcPricePerM2(u.avgPrice, sizeAvg);
    if (typeof u.units==='number') totalUnits += u.units;
    if (ppsm!==null && typeof u.units==='number'){ weightedPpsm += ppsm*u.units; weightedUnits += u.units; }
    return {
      type: u.type, units: u.units, sizeMinM2: u.sizeMinM2, sizeMaxM2: u.sizeMaxM2,
      startingPrice: u.startingPrice, avgPrice: u.avgPrice, maxPrice: u.maxPrice,
      pricePerM2: ppsm, currency: u.currency||'RWF',
      confidence: u.confidence||'unknown', source: u.source||null, sourceDate: u.sourceDate||null
    };
  });
  return {
    rows: rows, totalUnits: totalUnits,
    blendedPricePerM2: weightedUnits ? weightedPpsm/weightedUnits : null
  };
}
function projectValueEstimate(p){
  var sum = unitMixSummary(p);
  if (!sum) return null;
  var total = 0, confCount = 0, confSum = 0, missing = false;
  sum.rows.forEach(function(r){
    if (typeof r.units==='number' && typeof r.avgPrice==='number'){
      total += r.units*r.avgPrice;
      confSum += (r.confidence==='verified'?95:r.confidence==='reported'?75:r.confidence==='estimated'?50:30);
      confCount++;
    } else { missing = true; }
  });
  if (!confCount) return null;
  return {
    totalEstimate: total,
    confidencePct: Math.round(confSum/confCount),
    partial: missing,
    method: 'Σ(unit count × average reported price) across logged unit types'+(missing?' — some types missing pricing, so this is a floor, not a total':'')
  };
}
function paymentScheduleCash(p, basePrice){
  if (!p.paymentPlan || !p.paymentPlan.length || typeof basePrice!=='number') return null;
  var cum = 0;
  return p.paymentPlan.map(function(ev){
    var amt = basePrice*(ev.pct/100);
    cum += amt;
    return {pct: ev.pct, label: ev.label, trigger: ev.trigger, date: ev.date, amount: amt, cumulative: cum};
  });
}
function marketPositionLabel(deltaPct){
  var a = Math.abs(deltaPct);
  var dir = deltaPct>=0 ? 'premium' : 'discount';
  if (a<=5) return 'Fairly priced';
  if (a<=15) return 'Moderate '+dir;
  return 'Significant '+dir;
}
function marketPosition(p, comps){
  var sum = unitMixSummary(p);
  if (!sum || sum.blendedPricePerM2===null) return null;
  var priced = comps.filter(function(c){ var s=unitMixSummary(c.p); return s && s.blendedPricePerM2!==null; });
  if (!priced.length) return {projectPpsm: sum.blendedPricePerM2, comparableMedian: null, deltaPct: null, label: null, n: 0};
  var vals = priced.map(function(c){ return unitMixSummary(c.p).blendedPricePerM2; }).sort(function(a,b){return a-b;});
  var mid = Math.floor(vals.length/2);
  var median = vals.length%2 ? vals[mid] : (vals[mid-1]+vals[mid])/2;
  var deltaPct = ((sum.blendedPricePerM2-median)/median)*100;
  return {projectPpsm: sum.blendedPricePerM2, comparableMedian: median, deltaPct: deltaPct, label: marketPositionLabel(deltaPct), n: priced.length};
}

// ---------------- nav ----------------
var NAVLINKS = [
  {h:'#/home', label:'Command Center'},
  {h:'#/search', label:'Property Search'},
  {h:'#/developers', label:'Developers'},
  {h:'#/market', label:'Market Intelligence'},

// ================= HOME =================
function viewHome(){
  var stalled = PROJECTS.filter(isOpportunityFlag);
  var underConstruction = PROJECTS.filter(function(p){ return (p.status||'').toLowerCase().indexOf('under construction')>=0 || (p.status||'').toLowerCase().indexOf('under development')>=0; });
  var highRisk = PROJECTS.filter(function(p){ return p.riskLevel==='HIGH' || p.riskLevel==='CRITICAL'; });
  var unitSummary=unitsSummary(PROJECTS); var totalUnits=unitSummary.known;
  var pipeline = PROJECTS.filter(function(p){ var s=(p.status||'').toLowerCase(); return s.indexOf('pipeline')>=0||s.indexOf('planned')>=0; });

  var feedEvents = [];
  PROJECTS.forEach(function(p){
    p.timeline.forEach(function(ev){
      if (ev.date && ev.date!=='Unknown') feedEvents.push({y:yearOf(ev.date)||0, text:ev.event, prop:p});
    });
  });
  feedEvents.sort(function(a,b){ return b.y-a.y; });
  feedEvents = feedEvents.slice(0,10);

  var opp = [];
  var completingSoon = PROJECTS.filter(function(p){ var y=yearOf(p.completion); return y && y<=2027 && (p.status||'').toLowerCase().indexOf('under')>=0; });
  var largePipeline = PROJECTS.filter(function(p){ return typeof p.units==='number' && p.units>=800 && (p.status||'').toLowerCase().match(/pipeline|planned|under/); });
  var topDelivery = DEVELOPERS.map(function(d){
    var projs=(d.projectIds||[]).map(function(id){return byId[id];}).filter(Boolean);
    var completed=projs.filter(function(p){var st=(p.status||'').toLowerCase();return st.indexOf('completed')>=0||st.indexOf('occupied')>=0||st.indexOf('delivered')>=0;}).length;
    return {developer:d, projects:projs, completed:completed, score:developerDeliveryScore(d,projs)};
  }).filter(function(x){return x.projects.length>=2 && x.score!==null;}).sort(function(a,b){return b.score-a.score;}).slice(0,3);

  var html = '';
  html += '<div class="pagehead"><div><h1>Command Center</h1><div class="desc">Rwanda real-estate intelligence, connected end to end — every figure below traces back to a named source or an explicit data gap.</div></div>' +
    '<div class="searchbar" style="width:360px;"><input id="homeSearch" type="text" placeholder="Search property, developer, district, parcel…"><button class="btn primary" data-action="home-search">Search</button></div></div>';

  html += '<div class="section-title">Market Pulse</div><div class="grid g4" style="margin-bottom:16px;">';
  var pulse = [
    ['Tracked assets', PROJECTS.length],
    ['Logged developers', DEVELOPERS.length],
    ['Known units on file', fmtNum(totalUnits)+(unitSummary.unknown?' + '+unitSummary.unknown+' unknown':'')],
    ['Active developments', underConstruction.length],
    ['Stalled / at risk', stalled.length],
    ['Pipeline / planned', pipeline.length],
    ['High or critical risk', highRisk.length],
    ['Market segments', SEGMENTS.length]
  ];
  pulse.forEach(function(x){
    html += '<div class="panel kpi"><div class="v">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';
  });
  html += '</div>';

  var ec=evidenceCoverage(PROJECTS), sourced=PROJECTS.filter(function(p){return !!p.source;}).length, unknownUnits=PROJECTS.filter(function(p){return typeof p.units!=='number';}).length;
  html += '<div class="signal-grid">';
  html += '<div class="signal-box"><div class="big">'+ec.pct+'%</div><div class="label">field evidence verified</div></div>';
  html += '<div class="signal-box"><div class="big">'+sourced+'/'+PROJECTS.length+'</div><div class="label">assets with named source</div></div>';
  html += '<div class="signal-box"><div class="big">'+unknownUnits+'</div><div class="label">assets with unknown units</div></div>';
  html += '<div class="signal-box"><div class="big">'+ec.unverified+'</div><div class="label">unverified fields</div></div>';
  html += '</div>';

  html += '<div class="grid g2">';
  html += '<div class="panel"><div class="section-title">Intelligence Feed — most recent dated events</div>' +
    feedEvents.map(function(f){
      return '<div class="feed-item"><div class="feed-dot"></div><div class="feed-body">' +
        '<div class="feed-title"><a href="#/property/'+f.prop.id+'">'+esc(f.prop.name)+'</a> — '+esc(f.text)+'</div>' +
        '<div class="feed-meta">'+(f.y||'—')+' · '+esc(f.prop.district)+' · '+riskPill(f.prop.riskLevel,f.prop.riskScore)+'</div></div></div>';
    }).join('') + '</div>';

  html += '<div class="panel"><div class="section-title">Opportunity Radar — heuristic, structural signals only</div>';
  html += '<div class="callout" style="margin-bottom:10px;">These flag <b>structural</b> patterns in logged data (delays, pipeline concentration, delivery reliability). No pricing data exists yet in this dataset, so no valuation-gap alerts are shown — see Market Intelligence for the data gap.</div>';
  html += '<div style="font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:6px;"><b>'+completingSoon.length+'</b> active projects report completion by 2027</div>';
  html += '<div style="font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:6px;"><b>'+largePipeline.length+'</b> large-scale developments (800+ units) still in build-out or pipeline</div>';
  html += '<div style="font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:10px;"><b>'+stalled.length+'</b> asset(s) explicitly reported stalled or with a developer/ownership change</div>';
  html += '<div class="hr"></div><div style="font-size:var(--fs-xs);color:var(--ink-faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Observed delivery heuristic · at least two linked projects and completed evidence</div>';
  html += topDelivery.map(function(x){ var d=x.developer; return '<div class="feed-item"><div class="feed-dot" style="background:var(--good)"></div><div class="feed-body"><div class="feed-title"><a href="#/developer/'+d.id+'">'+esc(d.name)+'</a></div><div class="feed-meta">Heuristic score '+x.score+'/100 · '+x.completed+'/'+x.projects.length+' linked projects completed</div></div></div>'; }).join('');
  if(!topDelivery.length) html += '<div class="emptystate">No developer currently has both two linked projects and completed-status evidence. Reliability remains UNKNOWN until supporting records exist.</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="panel" style="margin-top:14px;"><div class="section-title">Investigations — saved to this session</div>';
  if (STATE.watchProps.length===0 && STATE.cases.length===0){

  }
  html += '</div>';

  document.getElementById('main').innerHTML = html;
}

// ================= SEARCH / TABLE =================
var searchState = { q:'', sortKey:'name', sortDir:1, pendingQ:null };
function parseQuery(q){
  var filters = {}; var chips = [];
  var ql = q.toLowerCase();
  var districts = ['nyarugenge','gasabo','kicukiro','karongi','rwamagana'];
  districts.forEach(function(d){ if(ql.indexOf(d)>=0){ filters.district = d; chips.push('district: '+d); } });
  var statuses = [['stalled','stall'],['completed','complet'],['under construction','under construct'],['pipeline','pipeline'],['planned','planned']];
  statuses.forEach(function(s){ if(ql.indexOf(s[0])>=0){ filters.status = s[1]; chips.push('status: '+s[0]); } });
  var risks = ['low','medium','high','critical'];
  var rm = ql.match(/risk[: ]?(low|medium|high|critical)/);
  if(rm){ filters.risk = rm[1].toUpperCase(); chips.push('risk: '+rm[1]); }
  var classes = ['luxury','premium','affordable','commercial','mixed-use','residential','rehousing','green'];
  classes.forEach(function(c){ if(ql.indexOf(c)>=0){ filters.assetClass = c; chips.push('asset class: '+c); } });
  var um = ql.match(/units\s*([<>]=?)\s*(\d+)/);
  if(um){ filters.unitsOp = um[1]; filters.unitsVal = parseInt(um[2],10); chips.push('units '+um[1]+' '+um[2]); }
  var cm = ql.match(/confidence\s*([<>]=?)\s*(\d+)/);
  if(cm){ filters.confOp = cm[1]; filters.confVal = parseInt(cm[2],10); chips.push('confidence '+cm[1]+' '+cm[2]); }
  var devm = ql.match(/(?:by|developer:?)\s+([a-z][a-z .]{2,30})/);
  if(devm){ filters.devText = devm[1].trim(); chips.push('developer: '+devm[1].trim()); }
  return {filters:filters, chips:chips, raw:q};
}
function applyFilters(list, parsed){
  var f = parsed.filters;
  var freeTerms = parsed.raw.toLowerCase();
  return list.filter(function(p){
    if (f.district && (p.district||'').toLowerCase().indexOf(f.district)<0) return false;
    if (f.status && (p.status||'').toLowerCase().indexOf(f.status)<0) return false;
    if (f.risk && p.riskLevel !== f.risk) return false;
    if (f.assetClass && (p.assetClass||'').toLowerCase().indexOf(f.assetClass)<0 && (p.category||'').toLowerCase().indexOf(f.assetClass)<0) return false;
    if (f.unitsOp && typeof p.units==='number'){
      if (f.unitsOp==='>' && !(p.units>f.unitsVal)) return false;
      if (f.unitsOp==='<' && !(p.units<f.unitsVal)) return false;
      if (f.unitsOp==='>=' && !(p.units>=f.unitsVal)) return false;

var dossierTab = {};
function computeComparables(p){
  // Structural terms (location/class/units/land/completion) are unchanged and
  // always contribute. Price/m² and bedroom-mix terms only engage once both
  // assets carry unitMix data — until then they contribute 0 and the score
  // is exactly the original structural-similarity result, so this is a safe
  // extension of the existing scoring, not a replacement.
  var pSum = unitMixSummary(p);
  var pTypes = pSum ? {} : null;
  if (pSum) pSum.rows.forEach(function(r){ if (typeof r.units==='number') pTypes[r.type] = r.units; });
  return PROJECTS.filter(function(o){ return o.id!==p.id; }).map(function(o){
    var score = 0;
    if (o.district===p.district) score += 20;
    if (o.sector===p.sector) score += 12;
    if (o.assetClass===p.assetClass) score += 20;
    if (typeof o.units==='number' && typeof p.units==='number'){
      var diff = Math.abs(o.units-p.units);
      score += Math.max(0, 12 - diff/20);
    }
    if (typeof o.land_ha==='number' && typeof p.land_ha==='number'){
      var d2 = Math.abs(o.land_ha-p.land_ha);
      score += Math.max(0, 8 - d2);
    }
    var y1 = yearOf(p.completion), y2 = yearOf(o.completion);
    if (y1 && y2) score += Math.max(0, 5 - Math.abs(y1-y2));
    // price/m² closeness — up to 15 pts, only when both priced
    var oSum = unitMixSummary(o);
    if (pSum && pSum.blendedPricePerM2!==null && oSum && oSum.blendedPricePerM2!==null){
      var pctDiff = Math.abs(pSum.blendedPricePerM2-oSum.blendedPricePerM2)/pSum.blendedPricePerM2*100;
      score += Math.max(0, 15 - pctDiff);
    }
    // bedroom-mix overlap — up to 8 pts, only when both have typed unit mixes
    if (pTypes && oSum){
      var oTypes = {}; oSum.rows.forEach(function(r){ if (typeof r.units==='number') oTypes[r.type]=r.units; });
      var shared = Object.keys(pTypes).filter(function(t){ return oTypes.hasOwnProperty(t); });
      if (shared.length) score += Math.min(8, shared.length*2.5);
    }
    return {p:o, score: Math.min(100, Math.round(score))};
  }).sort(function(a,b){ return b.score-a.score; }).filter(function(x){return x.score>=25;}).slice(0,6);
}

// ================= UNDERWRITING (standalone) =================
var calcStore = {};
function getCalcState(key){
  /* No market or financing assumptions are known by default. The analyst must
     supply the inputs; use an explicit 0 for a zero-debt / zero-growth case. */
  if (!calcStore[key]) calcStore[key] = {
    price:'',rentMonthly:'',vacancy:'',opex:'',loan:'',rate:'',amort:'',hold:'',exitCap:'',rentGrowth:'',sellCost:''
  };
  return calcStore[key];
}
function computeUnderwriting(s){
  var num=function(v){
    if(v===''||v===null||v===undefined) return null;
    var n=Number(v);
    return isFinite(n)?n:null;
  };
  var price=num(s.price),rent=num(s.rentMonthly),vacancy=num(s.vacancy),opex=num(s.opex),loan=num(s.loan),rate=num(s.rate),amort=num(s.amort),hold=num(s.hold),exitCap=num(s.exitCap),rentGrowth=num(s.rentGrowth),sellCost=num(s.sellCost),errors=[];
  if(price===null||price<=0)errors.push('Enter a purchase price greater than 0.');
  if(rent===null||rent<0)errors.push('Enter a monthly gross rent of 0 or more.');
  if(vacancy===null||vacancy<0||vacancy>100)errors.push('Enter vacancy from 0% to 100%.');
  if(opex===null||opex<0||opex>100)errors.push('Enter operating expenses from 0% to 100% of effective gross income.');
  if(loan===null||loan<0)errors.push('Enter a loan amount; use 0 for an all-equity purchase.');
  if(rate===null||rate<0)errors.push('Enter an annual interest rate of 0% or more.');
  if(amort===null||amort<=0)errors.push('Enter an amortization period greater than 0 years.');
  if(hold===null||hold<=0)errors.push('Enter a holding period greater than 0 years.');
  if(exitCap!==null&&exitCap<=0)errors.push('Exit cap rate must be greater than 0%, or left blank to use the modelled entry cap rate.');
  if(rentGrowth===null)errors.push('Enter a rent growth rate; use 0 if no growth is assumed.');
  if(sellCost===null||sellCost<0||sellCost>100)errors.push('Enter selling costs from 0% to 100%.');
  if(price!==null&&loan!==null&&loan>price)errors.push('Loan amount cannot exceed purchase price.');
  if(errors.length)return {valid:false,errors:errors};
  var egi=rent*12*(1-vacancy/100),opexAmt=egi*(opex/100),noi=egi-opexAmt,capRate=100*noi/price,monthlyRate=(rate/100)/12,nPay=amort*12;
  var loanPayment=loan>0?(monthlyRate===0?loan/nPay:loan*monthlyRate/(1-Math.pow(1+monthlyRate,-nPay))):0,annualDS=loanPayment*12,dscr=annualDS>0?noi/annualDS:null,equity=price-loan,cashFlow=noi-annualDS,coc=equity>0?100*cashFlow/equity:null;
  var bal=loan,cf=[-equity],noiY=noi;
  for(var y=1;y<=hold;y++){for(var m=0;m<12;m++){var interest=bal*monthlyRate;var principal=loanPayment-interest;bal-=principal;}cf.push(noiY-annualDS);noiY*=1+rentGrowth/100;}
  var exitCapUsed=exitCap===null?capRate:exitCap,exitValue=exitCapUsed>0?noiY/(exitCapUsed/100):0,netProceeds=exitValue-exitValue*(sellCost/100)-Math.max(0,bal);cf[cf.length-1]+=netProceeds;
  var totalDistributions=cf.slice(1).reduce(function(a,b){return a+b;},0);
  return {valid:true,egiAnnual:egi,opexAmt:opexAmt,noi:noi,capRate:capRate,loanPayment:loanPayment,annualDS:annualDS,dscr:dscr,equity:equity,cashFlow:cashFlow,coc:coc,exitValue:exitValue,netProceeds:netProceeds,irr:solveIRR(cf),equityMultiple:equity>0?totalDistributions/equity:null,exitCapUsed:exitCapUsed,exitCapFromEntry:exitCap===null};
}

function solveIRR(cf){
  var lo=-0.99, hi=3.0;
  function npv(r){ return cf.reduce(function(a,v,i){ return a+v/Math.pow(1+r,i); },0); }
  if (npv(lo)*npv(hi) > 0) return null;
  for (var i=0;i<80;i++){ var mid=(lo+hi)/2; if (npv(lo)*npv(mid)<=0) hi=mid; else lo=mid; }
  return (lo+hi)/2*100;
}
function scenarioSet(base){
  function mod(rentPct, vacDelta, capDelta){
    var s = Object.assign({}, base);
    s.rentMonthly = base.rentMonthly*(1+rentPct/100);
    s.vacancy = base.vacancy + vacDelta;
    s.exitCap = base.exitCap==='' ? '' : Number(base.exitCap)+capDelta;
    return computeUnderwriting(s);
  }
  return {
    Base: mod(0,0,0),
    Upside: mod(10,-2,-0.5),
    Downside: mod(-10,3,0.5),
    Stress: mod(-20,10,1.5)
  };
}
function calcInputsHTML(key, s){
  var fields = [
    ['price','Purchase price (RWF)'],['rentMonthly','Gross monthly rent (RWF)'],['vacancy','Vacancy (%)'],
    ['opex','Operating expenses (% of EGI)'],['loan','Loan amount (RWF)'],['rate','Interest rate (%/yr)'],
    ['amort','Amortization (years)'],['hold','Holding period (years)'],['exitCap','Exit cap rate (%)'],
    ['rentGrowth','Rent growth (%/yr)'],['sellCost','Selling costs (%)']
  ];
  var html = '<div class="section-title">Assumptions — analyst inputs</div><div class="calc-assumptions">';
  fields.forEach(function(f){
    var inputId = 'calc-'+String(key).replace(/[^a-zA-Z0-9_-]/g,'-')+'-'+f[0];
    var guidance = f[0]==='loan' ? 'Use 0 for all-equity' : (f[0]==='rentGrowth' ? 'Use 0 if no growth' : (f[0]==='exitCap' ? 'Optional: defaults to modelled entry cap' : 'Enter supported assumption'));
    var minAttr = ['price','rentMonthly','vacancy','opex','loan','rate','amort','hold','sellCost'].indexOf(f[0])>=0 ? ' min="0"' : '';
    html += '<div><label class="field" for="'+esc(inputId)+'">'+f[1]+'</label><input id="'+esc(inputId)+'" type="number" step="any"'+minAttr+' value="'+esc(s[f[0]])+'" placeholder="'+esc(guidance)+'" aria-label="'+esc(f[1])+'" data-action="update-calc" data-key="'+esc(key)+'" data-field="'+esc(f[0])+'"></div>';
  });
  html += '</div>';
  return html;
}
function calcResultsHTML(r){
  var html='<div class="section-title">Reactive underwriting output</div>';
  if(!r.valid) return html+'<div class="callout bad"><b>Model waiting for valid assumptions.</b><div style="margin-top:6px;">'+r.errors.map(function(e){return esc(e);}).join('<br>')+'</div></div>';
  html += '<div class="calc-results-list">';
  [['Effective gross income / yr',fmtNum(r.egiAnnual)+' RWF'],['Operating expenses / yr',fmtNum(r.opexAmt)+' RWF'],['NOI / yr',fmtNum(r.noi)+' RWF'],['Cap rate',fmtPct(r.capRate,2)],['Annual debt service',fmtNum(r.annualDS)+' RWF'],['DSCR',r.dscr!==null?r.dscr.toFixed(2)+'x':'—'],['Equity required',fmtNum(r.equity)+' RWF'],['Year-1 cash flow',fmtNum(r.cashFlow)+' RWF'],['Cash-on-cash',r.coc!==null?fmtPct(r.coc,2):'—'],['Modelled exit value',fmtNum(r.exitValue)+' RWF'],['Net sale proceeds',fmtNum(r.netProceeds)+' RWF'],['Equity multiple',r.equityMultiple!==null?r.equityMultiple.toFixed(2)+'x':'—'],['IRR',r.irr!==null?fmtPct(r.irr,1):'no solution in range'],['Exit cap used',fmtPct(r.exitCapUsed,2)+(r.exitCapFromEntry?' (entry cap)':'')]].forEach(function(l){html+='<div class="result-line"><span class="l">'+l[0]+'</span><span class="v">'+l[1]+'</span></div>';});
  html += '</div>';
  if(r.dscr!==null&&r.dscr<1.2) html+='<div class="callout bad" style="margin-top:8px;">LOW DSCR — debt service coverage is below 1.2x at these assumptions.</div>';
  return html;
}

function calcScenarioHTML(s){var base=computeUnderwriting(s);if(!base.valid)return '<div class="hr"></div><div class="callout">Scenario matrix appears after the base model has valid assumptions.</div>';var sc=scenarioSet(s),html='<div class="hr"></div><div class="section-title">Scenario matrix</div><table class="scenario-table"><thead><tr><th>Scenario</th><th>IRR</th><th>DSCR</th><th>Cap rate</th></tr></thead><tbody>';['Base','Upside','Downside','Stress'].forEach(function(k){var r=sc[k];html+='<tr><td>'+k+'</td><td>'+(r.irr!==null?fmtPct(r.irr,1):'—')+'</td><td>'+(r.dscr!==null?r.dscr.toFixed(2)+'x':'—')+'</td><td>'+fmtPct(r.capRate,2)+'</td></tr>';});return html+'</tbody></table>';}

function viewUnderwriting(){
  var html = '<div class="pagehead"><div><h1>Underwriting Model</h1><div class="desc">A standalone reactive acquisition model. Open it from any property dossier to attach it to that asset, or run it freestanding here.</div></div></div>';
  html += renderUnderwritingPanel({id:'__standalone__'});
  document.getElementById('main').innerHTML = html;
}

// ================= CASES / INVESTIGATIONS =================
function viewCases(){
  var html = '<div class="pagehead"><div><h1>Investigations</h1><div class="desc">Session watchlists and due-diligence cases. This prototype keeps them in memory for the current session only — a production build would persist these per analyst account.</div></div>' +
    '<button class="btn primary" data-action="new-case">New case</button></div>';

  html += '<div class="grid g2">';
  html += '<div class="panel"><div class="section-title">Property watchlist ('+STATE.watchProps.length+')</div>';
  if (!STATE.watchProps.length) html += '<div class="emptystate">Empty.</div>';
  STATE.watchProps.forEach(function(id){ var p=byId[id]; if(!p) return;
    html += '<div class="node-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div data-route="#/property/'+id+'" tabindex="0" role="link"><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(p.district)+'</div></div>' +
      '<button class="btn small ghost" data-action="toggle-watch" data-id="'+id+'">remove</button></div>';
  });
  html += '</div>';
  html += '<div class="panel"><div class="section-title">Developer watchlist ('+STATE.watchDevs.length+')</div>';
  if (!STATE.watchDevs.length) html += '<div class="emptystate">Empty.</div>';
  STATE.watchDevs.forEach(function(id){ var d=devById[id]; if(!d) return;
    html += '<div class="node-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div data-route="#/developer/'+id+'" tabindex="0" role="link"><div class="t">'+esc(d.name)+'</div><div class="s">'+d.projectCount+' projects</div></div>' +
      '<button class="btn small ghost" data-action="toggle-watch-dev" data-id="'+id+'">remove</button></div>';
  });
  html += '</div></div>';

  html += '<div class="panel" style="margin-top:14px;"><div class="section-title">Case files ('+STATE.cases.length+')</div>';
  if (!STATE.cases.length) html += '<div class="emptystate">No open cases. Start one from a property or developer dossier, or use "New case" above.</div>';
  STATE.cases.forEach(function(c){
    var done = c.tasks.filter(function(t){return t.status==='Verified';}).length;
    html += '<div class="panel" style="background:var(--panel-2);margin-bottom:12px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
      '<div><div style="font-weight:700;">CASE '+c.id+' — '+esc(c.title)+'</div><div style="font-size:var(--fs-xs);color:var(--ink-faint);">Target: '+esc(c.targetLabel)+' · '+done+'/'+c.tasks.length+' checks verified</div></div>' +
      '<div style="display:flex;gap:6px;"><button class="btn small" data-action="export-case" data-case-id="'+c.id+'">Export JSON</button><select data-action="case-conclusion" data-case-id="'+c.id+'" style="width:170px;">' +
      ['','Proceed','Proceed with conditions','Monitor','Reject'].map(function(o){return '<option '+(c.conclusion===o?'selected':'')+'>'+o+'</option>';}).join('') + '</select></div></div>';
    html += '<div class="hr" style="margin:10px 0;"></div>';
    c.tasks.forEach(function(t,ti){
      html += '<div class="checklist-item"><div style="flex:1;">'+esc(t.label)+'</div><select data-action="task-status" data-case-id="'+c.id+'" data-task-index="'+ti+'">' +
        ['Pending','Verified','Failed','Not applicable'].map(function(o){return '<option '+(t.status===o?'selected':'')+'>'+o+'</option>';}).join('') + '</select></div>';
    });
    html += '<div style="margin-top:8px;"><label class="field">Case notes</label><textarea rows="2" data-action="case-notes" data-case-id="'+c.id+'">'+esc(c.notes||'')+'</textarea></div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

// ================= ABOUT =================
function viewAbout(){
  var html = '<div class="pagehead"><div><h1>About this build</h1><div class="desc">What is real here, what is a modelled placeholder, and what a production version of Reja still needs.</div></div></div>';
  html += '<div class="panel"><div class="section-title">What is implemented in this prototype</div>' +
    '<ul style="margin:0;padding-left:18px;line-height:1.9;font-size:var(--fs-sm);color:var(--ink-soft);">' +
    '<li>54 tracked projects, 6 market segments, and 20 developers migrated from the original ledger, each given a permanent entity ID (property/developer), field-level provenance, and a source-tier classification.</li>' +
    '<li>Data confidence and risk scores computed transparently from the actual completeness/ambiguity of each record — every score shows its reasoning.</li>' +
    '<li>Ownership grouping, a structural comparables engine, a connections graph, and a due-diligence case workflow, all built on the real fields in the ledger.</li>' +
    '<li>A fully reactive financial underwriting model (NOI, cap rate, DSCR, cash-on-cash, IRR, exit, and a Base/Upside/Downside/Stress scenario matrix) — driven entirely by assumptions you enter, never by invented prices.</li>' +
    '<li>A structured query parser for property search that recognises district, status, risk, unit-count, confidence, and developer terms in free text.</li>' +
    '</ul></div>';
  html += '<div class="panel"><div class="section-title">Explicitly not real — needs a production backend</div>' +
    '<ul style="margin:0;padding-left:18px;line-height:1.9;font-size:var(--fs-sm);color:var(--ink-soft);">' +
    '<li>No parcel, unit-level, rent-roll, transaction, valuation, debt, permit, or document data exists yet for any asset — each dossier labels these NOT IN DB rather than fabricating figures.</li>' +
    '<li>No real photography is shown anywhere — every image slot says IMAGE NOT AVAILABLE, per the platform\u2019s own rule against inventing evidence.</li>' +
    '<li>Watchlists and case files live only in this browser tab\u2019s memory and are lost on refresh — a real deployment needs a database, authentication, and audit logging (see spec sections 47\u201349).</li>' +
    '<li>Natural-language search here is a keyword/pattern parser, not an LLM-to-query pipeline; document AI, ingestion pipelines, and automated conflict detection across multiple sources are unbuilt.</li>' +
    '<li>No live market time series (price/sqm, rent, absorption) exists — Market Intelligence shows an honest DATA GAP instead of guessed numbers.</li>' +
    '</ul></div>';
  html += '<div class="panel"><div class="section-title">Sources on file ('+SOURCES.length+')</div><table class="datatable"><thead><tr><th>Source</th><th>Publisher</th><th>Use</th></tr></thead><tbody>' +
    SOURCES.map(function(s){ return '<tr><td>'+esc(s.source)+'</td><td>'+esc(s.publisher)+'</td><td style="color:var(--ink-faint);">'+esc(s.use)+'</td></tr>'; }).join('') + '</tbody></table></div>';
  document.getElementById('main').innerHTML = html;
}

// ================= ROUTER =================
function render(){
  var hash = location.hash || '#/home';
  var parts = hash.replace('#/','').split('/');
  var route = parts[0];
  var activeNav = '#/'+route;
  if (route==='property' || route==='developer') activeNav = route==='property' ? '#/search' : '#/developers';
  if (route==='' ) { route='home'; activeNav='#/home'; }
  renderNav(activeNav);
  window.scrollTo(0,0);
  var mainEl = document.getElementById('main');
  mainEl.classList.remove('view-enter'); void mainEl.offsetWidth; mainEl.classList.add('view-enter');
  if (route==='home') viewHome();
  else if (route==='search') viewSearch();
  else if (route==='property') viewProperty(decodeURIComponent(parts[1]));
  else if (route==='developer') viewDeveloper(decodeURIComponent(parts[1]));
  else if (route==='developers') viewDevelopersList();
  else if (route==='market') viewMarket();
  else if (route==='graph') viewGraph(parts[1] ? decodeURIComponent(parts[1]) : null);
  else if (route==='underwriting') viewUnderwriting();
  else if (route==='cases') viewCases();
  else if (route==='about') viewAbout();
  else viewHome();
}

// ================= public API used by inline handlers =================
window.REJA = {
  render: render,
  goSearchFromHome: function(){ var q = document.getElementById('homeSearch').value; searchState.q=q; go('#/search'); },
  goSearchDistrict: function(d){ searchState.q = d; go('#/search'); },
  sortBy: function(k){ if (searchState.sortKey===k) searchState.sortDir*=-1; else { searchState.sortKey=k; searchState.sortDir=1; } viewSearch(searchState.q); },
  exportCSV: function(){
    var parsed = parseQuery(searchState.q);
    var rows = applyFilters(PROJECTS.slice(), parsed);
    var cols = ['id','name','district','sector','assetClass','developerName','ownerName','status','units','land_ha','start','completion','riskLevel','riskScore','dataConfidence','source'];
    var csv = cols.join(',')+'\n' + rows.map(function(p){ return cols.map(function(c){ var v=p[c]; v = (v===null||v===undefined)?'':String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reja_export.csv'; a.click();
  },
  setTab: function(id, tab){ dossierTab[id]=tab; viewProperty(id); },
  toggleWatch: function(id){ var i=STATE.watchProps.indexOf(id); if(i>=0) STATE.watchProps.splice(i,1); else STATE.watchProps.push(id); render(); },
  toggleWatchDev: function(id){ var i=STATE.watchDevs.indexOf(id); if(i>=0) STATE.watchDevs.splice(i,1); else STATE.watchDevs.push(id); render(); },
  centerGraph: function(id){ go('#/graph/'+id); },
  updateCalc: function(key, field, val){
    var s=getCalcState(key); s[field]=(val===''? '' : parseFloat(val));
    var out = document.getElementById('calcOut-'+key);
    if (out) out.innerHTML = calcOutHTML(key);
  },
  newCaseFor: function(targetId, targetType){
    var label = targetType==='property' ? byId[targetId].name : devById[targetId].name;
    var c = { id: 'RW-CASE-2026-'+String(STATE.caseSeq++).padStart(4,'0'), title: 'Diligence on '+label, targetId:targetId, targetType:targetType, targetLabel:label,
      conclusion:'', notes:'', tasks: DEFAULT_DD.map(function(l){ return {label:l, status:'Pending'}; }) };
    STATE.cases.push(c); go('#/cases');
  },
  newCase: function(){
    var label = prompt('Case subject (free text):','New investigation');
    if (label===null) return;
    var c = { id: 'RW-CASE-2026-'+String(STATE.caseSeq++).padStart(4,'0'), title: label||'Untitled case', targetId:null, targetType:null, targetLabel:label||'—',
      conclusion:'', notes:'', tasks: DEFAULT_DD.map(function(l){ return {label:l, status:'Pending'}; }) };
    STATE.cases.push(c); render();
  },
  setTaskStatus: function(caseId, ti, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.tasks[ti].status=val; },
  setCaseNotes: function(caseId, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.notes=val; },
  setCaseConclusion: function(caseId, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.conclusion=val; },
  exportCase: function(caseId){
    var c = STATE.cases.find(function(x){return x.id===caseId;});
    var blob = new Blob([JSON.stringify(c,null,2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = caseId+'.json'; a.click();
  }
};

function dispatchAction(el,type){var a=el&&el.dataset?el.dataset.action:null;if(!a)return false;if(type==='click'){if(a==='home-search'){REJA.goSearchFromHome();return true;}if(a==='export-csv'){REJA.exportCSV();return true;}if(a==='sort'){REJA.sortBy(el.dataset.key);return true;}if(a==='toggle-watch'){REJA.toggleWatch(el.dataset.id);render();return true;}if(a==='toggle-watch-dev'){REJA.toggleWatchDev(el.dataset.id);render();return true;}if(a==='new-case-for'){REJA.newCaseFor(el.dataset.id,el.dataset.type);return true;}if(a==='set-tab'){REJA.setTab(el.dataset.id,el.dataset.tab);return true;}if(a==='district-search'){REJA.goSearchDistrict(el.dataset.value);return true;}if(a==='new-case'){REJA.newCase();return true;}if(a==='export-case'){REJA.exportCase(el.dataset.caseId);return true;}}if(type==='change'){if(a==='center-graph'){REJA.centerGraph(el.value);return true;}if(a==='case-conclusion'){REJA.setCaseConclusion(el.dataset.caseId,el.value);return true;}if(a==='task-status'){REJA.setTaskStatus(el.dataset.caseId,Number(el.dataset.taskIndex),el.value);return true;}}if(type==='input'){if(a==='search-input'){searchState.q=el.value;renderTableOnly();return true;}if(a==='update-calc'){REJA.updateCalc(el.dataset.key,el.dataset.field,el.value);return true;}if(a==='case-notes'){REJA.setCaseNotes(el.dataset.caseId,el.value);return true;}}return false;}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-action]');if(a&&dispatchAction(a,'click')){e.preventDefault();return;}var r=e.target.closest&&e.target.closest('[data-route]');if(r){location.hash=r.dataset.route;e.preventDefault();}});
document.addEventListener('change',function(e){var a=e.target.closest&&e.target.closest('[data-action]');if(a)dispatchAction(a,'change');});
document.addEventListener('input',function(e){var a=e.target.closest&&e.target.closest('[data-action]');if(a)dispatchAction(a,'input');});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='homeSearch'){REJA.goSearchFromHome();e.preventDefault();return;}if(e.key!=='Enter'&&e.key!==' ')return;var a=e.target.closest&&e.target.closest('[data-action]');var r=e.target.closest&&e.target.closest('[data-route]');if(a&&!e.target.matches('input,select,textarea')){if(dispatchAction(a,'click'))e.preventDefault();}else if(r){location.hash=r.dataset.route;e.preventDefault();}});
window.addEventListener('hashchange', render);
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',render,{once:true});else render();
})();
</script>
