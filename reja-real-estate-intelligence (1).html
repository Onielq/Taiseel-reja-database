<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REJA — Rwanda Real Estate Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d0f;
  --bg-raised:#111417;
  --panel:#14181c;
  --panel-2:#191e23;
  --line:#262c31;
  --line-strong:#343b41;
  --ink:#e7eaec;
  --ink-soft:#a8b0b6;
  --ink-faint:#6b7378;
  --signal:#c98a3b;
  --signal-soft:#8a662f;
  --good:#5c9a6e;
  --warn:#c9a13b;
  --bad:#b9583f;
  --crit:#9c3b3b;
  --info:#4f8fa8;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --font-sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;
  --r:3px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--signal);color:#0b0d0f;}
a{color:var(--info);text-decoration:none;}
a:hover{text-decoration:underline;}
:focus-visible{outline:1.5px solid var(--signal);outline-offset:1px;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
.mono{font-family:var(--font-mono);}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ---------- shell layout ---------- */
#shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
#nav{
  background:var(--bg-raised);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;padding:18px 0 14px;
}
#nav .brand{padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
#nav .brand .mark{font-family:var(--font-mono);font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--ink);}
#nav .brand .sub{font-size:10.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em;}
#nav nav{display:flex;flex-direction:column;gap:1px;padding:6px 10px;}
#nav nav a{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
  color:var(--ink-soft);font-size:12.8px;font-weight:500;
}
#nav nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none;}
#nav nav a.active{background:var(--panel-2);color:var(--ink);border-left:2px solid var(--signal);padding-left:8px;}
#nav .navgroup-label{font-size:10px;color:var(--ink-faint);letter-spacing:.08em;padding:14px 20px 4px;}
#nav .footer-note{margin-top:auto;padding:12px 18px 0;font-size:10.5px;color:var(--ink-faint);border-top:1px solid var(--line);}

#main{min-width:0;padding:22px 30px 60px;max-width:1320px;}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.pagehead h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em;}
.pagehead .desc{color:var(--ink-soft);font-size:12.5px;margin-top:3px;max-width:640px;}
.crumb{font-size:11px;color:var(--ink-faint);margin-bottom:6px;font-family:var(--font-mono);}
.crumb a{color:var(--ink-faint);}
.crumb a:hover{color:var(--ink-soft);}

/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;}
.panel + .panel{margin-top:14px;}
.section-title{font-size:11px;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;font-weight:600;text-transform:uppercase;}
.hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);
  border:1px solid var(--line-strong);color:var(--ink);padding:6px 11px;border-radius:var(--r);
  font-size:12px;cursor:pointer;font-weight:500;
}
.btn:hover{border-color:var(--signal);color:var(--ink);}
.btn.primary{background:var(--signal-soft);border-color:var(--signal);color:#fff;}
.btn.primary:hover{background:var(--signal);}
.btn.ghost{background:transparent;}
.btn.small{padding:4px 8px;font-size:11px;}
input[type=text],input[type=number],select,textarea{
  background:var(--bg-raised);border:1px solid var(--line-strong);color:var(--ink);
  padding:7px 9px;border-radius:var(--r);font-size:12.5px;font-family:var(--font-sans);width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--signal);}
label.field{display:block;font-size:10.5px;color:var(--ink-faint);letter-spacing:.03em;margin-bottom:4px;text-transform:uppercase;}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line-strong);color:var(--ink-soft);font-weight:500;white-space:nowrap;}
.tag.verified{color:var(--good);border-color:#2e4a35;background:#122016;}
.tag.unverified{color:var(--warn);border-color:#4a3f1e;background:#221c0e;}
.tag.unknown{color:var(--ink-faint);border-color:var(--line-strong);}
.tag.conflict{color:var(--bad);border-color:#4a2620;background:#241410;}
.risk-LOW{color:var(--good);}
.risk-MEDIUM{color:var(--warn);}
.risk-HIGH{color:var(--bad);}
.risk-CRITICAL{color:var(--crit);font-weight:700;}
.pill-risk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;}
.pill-risk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;}

.statbar{width:100%;height:5px;background:var(--bg-raised);border-radius:3px;overflow:hidden;border:1px solid var(--line);}
.statbar > span{display:block;height:100%;background:var(--signal);}

table.datatable{width:100%;border-collapse:collapse;font-size:12.2px;}
table.datatable th{
  text-align:left;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;
  padding:7px 9px;border-bottom:1px solid var(--line-strong);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--panel);
}
table.datatable th:hover{color:var(--ink-soft);}
table.datatable td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.datatable tbody tr:hover{background:var(--panel-2);}
table.datatable tbody tr{cursor:pointer;}
.thumb{width:38px;height:28px;border-radius:2px;background:var(--bg-raised);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--ink-faint);text-align:center;line-height:1.1;flex-shrink:0;}

.kpi{display:flex;flex-direction:column;gap:2px;}
.kpi .v{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--ink);}
.kpi .l{font-size:10.5px;color:var(--ink-faint);letter-spacing:.03em;}

.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.feed-item:last-child{border-bottom:none;}
.feed-dot{width:6px;height:6px;border-radius:50%;background:var(--signal);margin-top:6px;flex-shrink:0;}
.feed-body{flex:1;min-width:0;}
.feed-title{font-size:12.5px;color:var(--ink);}
.feed-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;}
.tabs button{background:transparent;border:none;color:var(--ink-faint);padding:9px 13px;font-size:12px;font-weight:500;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tabs button:hover{color:var(--ink-soft);}
.tabs button.active{color:var(--ink);border-bottom-color:var(--signal);}

.dossier-head{display:grid;grid-template-columns:180px 1fr;gap:20px;margin-bottom:18px;}
.dossier-img{width:180px;height:135px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--bg-raised);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-size:10.5px;text-align:center;padding:10px;}
.factgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
@media (max-width:1100px){.factgrid{grid-template-columns:repeat(3,1fr);}}
.factgrid .kpi .v{font-size:16px;}

.evrow{display:grid;grid-template-columns:150px 1fr 100px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:center;}
.evrow:last-child{border-bottom:none;}
.evrow .k{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}

.node-card{border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;background:var(--panel-2);cursor:pointer;}
.node-card:hover{border-color:var(--signal);}
.node-card .t{font-size:12px;font-weight:600;color:var(--ink);}
.node-card .s{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}

.callout{border:1px solid var(--line-strong);border-left:3px solid var(--signal);background:var(--panel-2);border-radius:4px;padding:10px 12px;font-size:12px;color:var(--ink-soft);}
.callout.warn{border-left-color:var(--warn);}
.callout.bad{border-left-color:var(--bad);}
.callout.good{border-left-color:var(--good);}

.emptystate{padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:12.5px;}
.searchbar{display:flex;gap:8px;}
.searchbar input{font-family:var(--font-mono);font-size:13px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--signal-soft);color:var(--signal);font-family:var(--font-mono);}

.calc-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;}
@media (max-width:900px){.calc-grid{grid-template-columns:1fr;}}
.result-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.result-line .l{color:var(--ink-faint);}
.result-line .v{font-family:var(--font-mono);font-weight:600;}
.scenario-table{width:100%;border-collapse:collapse;font-size:12px;}
.scenario-table th,.scenario-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-mono);}
.scenario-table th:first-child,.scenario-table td:first-child{text-align:left;font-family:var(--font-sans);}
.scenario-table th{color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;font-weight:500;}

.checklist-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.checklist-item select{width:140px;}
.svglink{stroke:var(--line-strong);stroke-width:1.2;}
.svgnode{fill:var(--panel-2);stroke:var(--line-strong);}
.svgnode.center{stroke:var(--signal);}
.svgtext{fill:var(--ink);font-size:10px;font-family:var(--font-sans);}
.svgtext.dim{fill:var(--ink-faint);font-size:9px;}

@media (max-width:820px){
  #shell{grid-template-columns:1fr;}
  #nav{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px;}
  #nav .brand{border:none;padding:0 10px 0 0;margin:0;}
  #nav nav{flex-direction:row;flex-wrap:wrap;padding:0;}
  #nav .footer-note{display:none;}
  .factgrid{grid-template-columns:repeat(2,1fr);}
  .dossier-head{grid-template-columns:1fr;}
}
</style>
</head>

  <aside id="nav">

    <nav id="navlinks"></nav>
    <div class="footer-note">Prototype workstation. In-browser session data only — see About for what runs on a real backend.</div>
  </aside>
  <main id="main"></main>
</div>

W-RWM-RWA-0001", "RW-GAS-KIG-0024"], "Imara Properties": ["RW-KIC-REB-0004", "RW-KIC-REB-0005", "RW-GAS-KIB-0006", "RW-KIC-KAN-0006", "RW-KIC-REB-0007", "RW-GAS-KIM-0007"], "Fortico Group": ["RW-GAS-KIG-0008", "RW-GAS-GAC-0009", "RW-GAS-NYA-0010", "RW-GAS-KIM-0011", "RW-GAS-KIN-0012"], "Homart Properties": ["RW-GAS-NYA-0013", "RW-GAS-NYA-0014", "RW-GAS-NYA-0015", "RW-NYA-UBU-0003", "RW-NYA-UBU-0004", "RW-NYA-UBU-0005", "RW-GAS-NYA-0016", "RW-GAS-NYA-0017", "RW-KIC-KAN-0008", "RW-KIC-KAN-0009"], "Reportage Properties": ["RW-GAS-NYA-0018", "RW-GAS-KAC-0019"], "Belle Ville Groupe": ["RW-NYA-KIY-0006", "RW-GAS-KAC-0020"]}}</script>
<script>(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('reja-data').textContent);
var PROJECTS = DATA.projects, DEVELOPERS = DATA.developers, SOURCES = DATA.sources, OWNER_GROUPS = DATA.ownerGroups;
var byId = {}; PROJECTS.forEach(function(p){ byId[p.id] = p; });
var devById = {}; DEVELOPERS.forEach(function(d){ devById[d.id] = d; });

// ---------------- session state (in-memory only; resets on reload) ----------------
var STATE = {
  watchProps: [], watchDevs: [],
  cases: [], // {id, title, targetId, targetType, status, tasks:[{label,status,notes}], notes, created}
  caseSeq: 1
};
var DEFAULT_DD = ['Title & Ownership','Encumbrances','Land & Parcel','Planning & Zoning','Permits','Environment','Financing','Leases & Tenants','Valuation','Legal / Corporate'];

// ---------------- utils ----------------
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(v){ return (v===null||v===undefined||v==='') ? '—' : v; }
function fmtNum(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }
function fmtPct(n,d){ if(n===null||n===undefined||isNaN(n)) return '—'; return n.toFixed(d===undefined?1:d)+'%'; }
function yearOf(s){ if(!s) return null; var m = String(s).match(/(20\d{2})/); return m ? parseInt(m[1],10) : null; }
function statusTag(status){
  var s = status ? status.toLowerCase() : '';
  var cls = 'unknown';
  if (s.indexOf('to verify')>=0) cls='unverified';
  else if (s.indexOf('stall')>=0) cls='conflict';
  else if (s) cls='verified';
  return '<span class="tag '+cls+'">'+esc(status||'UNKNOWN')+'</span>';
}
function fieldTag(fstatus){
  return '<span class="tag '+fstatus+'">'+fstatus.toUpperCase()+'</span>';
}
function riskPill(level, score){
  return '<span class="pill-risk risk-'+level+'">'+level+' <span class="num" style="color:var(--ink-faint)">('+score+')</span></span>';
}
function confBar(v){
  return '<div style="display:flex;align-items:center;gap:8px;"><div class="statbar" style="width:60px;"><span style="width:'+v+'%"></span></div><span class="num" style="font-size:11px;color:var(--ink-soft)">'+v+'</span></div>';
}
function sourceTier(url){
  if(!url) return {t:'D', label:'No source on file'};
  var u = url.toLowerCase();
  if (u.indexOf('.gov.rw')>=0 || u.indexOf('rha.gov')>=0 || u.indexOf('rdb')>=0) return {t:'A', label:'Official / government source'};
  if (u.indexOf('newtimes')>=0 || u.indexOf('visionmedia')>=0) return {t:'B', label:'Established news organisation'};
  return {t:'C', label:'Developer / marketing website'};
}
function go(hash){ location.hash = hash; }
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

// ---------------- nav ----------------
var NAVLINKS = [
  {h:'#/home', label:'Command Center'},
  {h:'#/search', label:'Property Search'},
  {h:'#/developers', label:'Developers'},
  {h:'#/market', label:'Market Intelligence'},
  {h:'#/graph', label:'Connections Graph'},
  {h:'#/underwriting', label:'Underwriting Model'},
  {h:'#/cases', label:'Investigations'},
  {h:'#/about', label:'About / Data Model'}
];
function renderNav(active){
  var wrap = document.getElementById('navlinks');
  wrap.innerHTML = NAVLINKS.map(function(n){
    return '<a href="'+n.h+'" class="'+(active===n.h?'active':'')+'">'+n.label+'</a>';
  }).join('');
}

// ================= HOME =================
function viewHome(){
  var stalled = PROJECTS.filter(function(p){ return (p.status||'').toLowerCase().indexOf('stall')>=0; });
  var underConstruction = PROJECTS.filter(function(p){ return (p.status||'').toLowerCase().indexOf('under construction')>=0 || (p.status||'').toLowerCase().indexOf('under development')>=0; });
  var highRisk = PROJECTS.filter(function(p){ return p.riskLevel==='HIGH' || p.riskLevel==='CRITICAL'; });
  var totalUnits = PROJECTS.reduce(function(a,p){ return a + (typeof p.units==='number'?p.units:0); },0);
  var pipeline = PROJECTS.filter(function(p){ var s=(p.status||'').toLowerCase(); return s.indexOf('pipeline')>=0||s.indexOf('planned')>=0; });

  var feedEvents = [];
  PROJECTS.forEach(function(p){
    p.timeline.forEach(function(ev){
      if (ev.date && ev.date!=='Unknown') feedEvents.push({y:yearOf(ev.date)||0, text:ev.event, prop:p});
    });
  });
  feedEvents.sort(function(a,b){ return b.y-a.y; });
  feedEvents = feedEvents.slice(0,10);

  var opp = [];
  var completingSoon = PROJECTS.filter(function(p){ var y=yearOf(p.completion); return y && y<=2027 && (p.status||'').toLowerCase().indexOf('under')>=0; });
  var largePipeline = PROJECTS.filter(function(p){ return typeof p.units==='number' && p.units>=800 && (p.status||'').toLowerCase().match(/pipeline|planned|under/); });
  var topDelivery = DEVELOPERS.slice().filter(function(d){return d.projectCount>=2;}).sort(function(a,b){return (b.deliveryScore||0)-(a.deliveryScore||0);}).slice(0,3);

  var html = '';
  html += '<div class="pagehead"><div><h1>Command Center</h1><div class="desc">Rwanda real-estate intelligence, connected end to end — every figure below traces back to a named source or an explicit data gap.</div></div>' +
    '<div class="searchbar" style="width:360px;"><input id="homeSearch" type="text" placeholder="Search property, developer, district, parcel…"><button class="btn primary" onclick="REJA.goSearchFromHome()">Search</button></div></div>';

  html += '<div class="section-title">Market Pulse</div><div class="grid g4" style="margin-bottom:16px;">';
  var pulse = [
    ['Tracked assets', PROJECTS.length],
    ['Logged developers', DEVELOPERS.length],
    ['Total units on file', fmtNum(totalUnits)],
    ['Active developments', underConstruction.length],
    ['Stalled / at risk', stalled.length],
    ['Pipeline / planned', pipeline.length],
    ['High or critical risk', highRisk.length],
    ['Avg. data confidence', Math.round(PROJECTS.reduce(function(a,p){return a+p.dataConfidence;},0)/PROJECTS.length)]
  ];
  pulse.forEach(function(x){
    html += '<div class="panel kpi"><div class="v">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';
  });
  html += '</div>';

  html += '<div class="grid g2">';
  html += '<div class="panel"><div class="section-title">Intelligence Feed — most recent dated events</div>' +
    feedEvents.map(function(f){
      return '<div class="feed-item"><div class="feed-dot"></div><div class="feed-body">' +
        '<div class="feed-title"><a href="#/property/'+f.prop.id+'">'+esc(f.prop.name)+'</a> — '+esc(f.text)+'</div>' +
        '<div class="feed-meta">'+(f.y||'—')+' · '+esc(f.prop.district)+' · '+riskPill(f.prop.riskLevel,f.prop.riskScore)+'</div></div></div>';
    }).join('') + '</div>';

  html += '<div class="panel"><div class="section-title">Opportunity Radar — heuristic, structural signals only</div>';
  html += '<div class="callout" style="margin-bottom:10px;">These flag <b>structural</b> patterns in logged data (delays, pipeline concentration, delivery reliability). No pricing data exists yet in this dataset, so no valuation-gap alerts are shown — see Market Intelligence for the data gap.</div>';
  html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;"><b>'+completingSoon.length+'</b> active projects report completion by 2027</div>';
  html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;"><b>'+largePipeline.length+'</b> large-scale developments (800+ units) still in build-out or pipeline</div>';
  html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;"><b>'+stalled.length+'</b> asset(s) explicitly reported stalled or with a developer/ownership change</div>';
  html += '<div class="hr"></div><div style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Highest delivery-reliability developers</div>';
  html += topDelivery.map(function(d){ return '<div class="feed-item"><div class="feed-dot" style="background:var(--good)"></div><div class="feed-body"><div class="feed-title"><a href="#/developer/'+d.id+'">'+esc(d.name)+'</a></div><div class="feed-meta">Delivery score '+d.deliveryScore+'/100 · '+d.completedCount+'/'+d.projectCount+' projects completed</div></div></div>'; }).join('');
  html += '</div>';
  html += '</div>';

  html += '<div class="panel" style="margin-top:14px;"><div class="section-title">Investigations — saved to this session</div>';
  if (STATE.watchProps.length===0 && STATE.cases.length===0){
    html += '<div class="emptystate">Nothing saved yet. Open a property dossier and use "Add to watchlist", or start a case from Investigations.</div>';
  } else {
    html += '<div class="grid g3">';
    STATE.watchProps.slice(0,6).forEach(function(id){ var p=byId[id]; if(p) html+='<div class="node-card" onclick="location.hash=\'#/property/'+id+'\'"><div class="t">'+esc(p.name)+'</div><div class="s">Watchlist · '+esc(p.district)+'</div></div>'; });
    html += '</div>';
  }
  html += '</div>';

  document.getElementById('main').innerHTML = html;
  document.getElementById('homeSearch').addEventListener('keydown', function(e){ if(e.key==='Enter') REJA.goSearchFromHome(); });
}

// ================= SEARCH / TABLE =================
var searchState = { q:'', sortKey:'name', sortDir:1, pendingQ:null };
function parseQuery(q){
  var filters = {}; var chips = [];
  var ql = q.toLowerCase();
  var districts = ['nyarugenge','gasabo','kicukiro','karongi','rwamagana','kigali'];
  districts.forEach(function(d){ if(ql.indexOf(d)>=0){ filters.district = d; chips.push('district: '+d); } });
  var statuses = [['stalled','stall'],['completed','complet'],['under construction','under construct'],['pipeline','pipeline'],['planned','planned']];
  statuses.forEach(function(s){ if(ql.indexOf(s[0])>=0){ filters.status = s[1]; chips.push('status: '+s[0]); } });
  var risks = ['low','medium','high','critical'];
  var rm = ql.match(/risk[: ]?(low|medium|high|critical)/);
  if(rm){ filters.risk = rm[1].toUpperCase(); chips.push('risk: '+rm[1]); }
  var classes = ['luxury','premium','affordable','commercial','mixed-use','residential','rehousing','green'];
  classes.forEach(function(c){ if(ql.indexOf(c)>=0){ filters.assetClass = c; chips.push('asset class: '+c); } });
  var um = ql.match(/units\s*([<>]=?)\s*(\d+)/);
  if(um){ filters.unitsOp = um[1]; filters.unitsVal = parseInt(um[2],10); chips.push('units '+um[1]+' '+um[2]); }
  var cm = ql.match(/confidence\s*([<>]=?)\s*(\d+)/);
  if(cm){ filters.confOp = cm[1]; filters.confVal = parseInt(cm[2],10); chips.push('confidence '+cm[1]+' '+cm[2]); }
  var devm = ql.match(/(?:by|developer:?)\s+([a-z][a-z .]{2,30})/);
  if(devm){ filters.devText = devm[1].trim(); chips.push('developer: '+devm[1].trim()); }
  return {filters:filters, chips:chips, raw:q};
}
function applyFilters(list, parsed){
  var f = parsed.filters;
  var freeTerms = parsed.raw.toLowerCase();
  return list.filter(function(p){
    if (f.district && (p.district||'').toLowerCase().indexOf(f.district)<0) return false;
    if (f.status && (p.status||'').toLowerCase().indexOf(f.status)<0) return false;
    if (f.risk && p.riskLevel !== f.risk) return false;
    if (f.assetClass && (p.assetClass||'').toLowerCase().indexOf(f.assetClass)<0 && (p.category||'').toLowerCase().indexOf(f.assetClass)<0) return false;
    if (f.unitsOp && typeof p.units==='number'){
      if (f.unitsOp==='>' && !(p.units>f.unitsVal)) return false;
      if (f.unitsOp==='<' && !(p.units<f.unitsVal)) return false;
      if (f.unitsOp==='>=' && !(p.units>=f.unitsVal)) return false;
      if (f.unitsOp==='<=' && !(p.units<=f.unitsVal)) return false;
    } else if (f.unitsOp && typeof p.units!=='number') return false;
    if (f.confOp){
      if (f.confOp==='>' && !(p.dataConfidence>f.confVal)) return false;
      if (f.confOp==='<' && !(p.dataConfidence<f.confVal)) return false;
      if (f.confOp==='>=' && !(p.dataConfidence>=f.confVal)) return false;
      if (f.confOp==='<=' && !(p.dataConfidence<=f.confVal)) return false;
    }
    if (f.devText && (p.developerName||'').toLowerCase().indexOf(f.devText)<0) return false;
    // fallback free text: only apply if no structured filters matched at all
    if (Object.keys(f).length===0 && parsed.raw.trim()!==''){
      var hay = (p.name+' '+p.district+' '+p.sector+' '+p.developerName+' '+p.ownerName+' '+p.category).toLowerCase();
      if (hay.indexOf(freeTerms)<0) return false;
    }
    return true;
  });
}
function viewSearch(qOverride){
  var q = qOverride!==undefined ? qOverride : searchState.q;
  searchState.q = q;
  var parsed = parseQuery(q);
  var rows = applyFilters(PROJECTS.slice(), parsed);
  var key = searchState.sortKey, dir = searchState.sortDir;
  rows.sort(function(a,b){
    var av=a[key], bv=b[key];
    if (typeof av==='string') av=(av||'').toLowerCase();
    if (typeof bv==='string') bv=(bv||'').toLowerCase();
    if (av===null||av===undefined) av = (typeof bv==='number')?-Infinity:'';
    if (bv===null||bv===undefined) bv = (typeof av==='number')?-Infinity:'';
    if (av<bv) return -1*dir; if (av>bv) return 1*dir; return 0;
  });

  var html = '<div class="pagehead"><div><h1>Property &amp; Project Search</h1><div class="desc">Type a plain description — district, status, risk, unit count, developer — recognised terms become filters; anything else falls back to a name/location match.</div></div></div>';
  html += '<div class="panel"><div class="searchbar"><input id="searchInput" type="text" value="'+esc(q)+'" placeholder="e.g. under construction in Gasabo risk:high units>100"></div>';
  html += '<div class="chips">'+(parsed.chips.length? parsed.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('') : '<span style="font-size:11px;color:var(--ink-faint);">No recognised filters — showing all assets'+(q?' matched by free text':'')+'.</span>')+'</div></div>';

  html += '<div class="panel" style="margin-top:14px;padding:0;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);">' +
    '<div style="font-size:12px;color:var(--ink-soft);">'+rows.length+' of '+PROJECTS.length+' assets</div>' +
    '<button class="btn small" onclick="REJA.exportCSV()">Export CSV</button></div>';
  html += '<div style="overflow-x:auto;"><table class="datatable"><thead><tr>' +
    ['','name:Property','district:Location','assetClass:Class','developerName:Developer','status:Status','units:Units','riskLevel:Risk','dataConfidence:Confidence'].map(function(c){
      if(c==='') return '<th></th>';
      var parts = c.split(':'); return '<th onclick="REJA.sortBy(\''+parts[0]+'\')">'+parts[1]+(searchState.sortKey===parts[0]?(dir>0?' \u2191':' \u2193'):'')+'</th>';
    }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(p){
    html += '<tr onclick="location.hash=\'#/property/'+p.id+'\'">' +
      '<td><div class="thumb">NO<br>IMAGE</div></td>' +
      '<td><div style="font-weight:600;">'+esc(p.name)+'</div><div class="mono" style="font-size:10px;color:var(--ink-faint);">'+p.id+'</div></td>' +
      '<td>'+esc(p.district)+'<div style="font-size:10.5px;color:var(--ink-faint);">'+esc(p.sector||'')+'</div></td>' +
      '<td>'+esc(p.assetClass)+'</td>' +
      '<td>'+esc(p.developerName||'—')+'</td>' +
      '<td>'+statusTag(p.status)+'</td>' +
      '<td class="num">'+(typeof p.units==='number'?fmtNum(p.units):'—')+'</td>' +
      '<td>'+riskPill(p.riskLevel,p.riskScore)+'</td>' +
      '<td>'+confBar(p.dataConfidence)+'</td>' +
      '</tr>';
  });
  if (rows.length===0) html += '<tr><td colspan="9"><div class="emptystate">No assets match this query.</div></td></tr>';
  html += '</tbody></table></div></div>';

  document.getElementById('main').innerHTML = html;
  var input = document.getElementById('searchInput');
  input.focus(); input.setSelectionRange(input.value.length,input.value.length);
  input.addEventListener('input', function(e){ searchState.q = e.target.value; renderTableOnly(); });
}
function renderTableOnly(){
  // lightweight re-render without stealing focus completely: just re-run viewSearch but restore cursor
  var pos = document.getElementById('searchInput').selectionStart;
  viewSearch(searchState.q);
  var input = document.getElementById('searchInput');
  input.focus(); input.setSelectionRange(pos,pos);
}

// ================= PROPERTY DOSSIER =================
var dossierTab = {};
function computeComparables(p){
  return PROJECTS.filter(function(o){ return o.id!==p.id; }).map(function(o){
    var score = 0;
    if (o.district===p.district) score += 30;
    if (o.sector===p.sector) score += 15;
    if (o.assetClass===p.assetClass) score += 25;
    if (typeof o.units==='number' && typeof p.units==='number'){
      var diff = Math.abs(o.units-p.units);
      score += Math.max(0, 15 - diff/20);
    }
    if (typeof o.land_ha==='number' && typeof p.land_ha==='number'){
      var d2 = Math.abs(o.land_ha-p.land_ha);
      score += Math.max(0, 10 - d2);
    }
    var y1 = yearOf(p.completion), y2 = yearOf(o.completion);
    if (y1 && y2) score += Math.max(0, 5 - Math.abs(y1-y2));
    return {p:o, score: Math.min(100, Math.round(score))};
  }).sort(function(a,b){ return b.score-a.score; }).filter(function(x){return x.score>=25;}).slice(0,6);
}
function fullSchemaRows(){
  return [
    ['Parcel & title','Parcel ID, title reference, encumbrances'],
    ['Unit-level register','Per-unit size, price, tenant, rent'],
    ['Rent roll','Actual rent, lease terms, arrears'],
    ['Transaction ledger','Registered sale prices, buyer/seller'],
    ['Valuation reports','Certified value, methodology, valuer'],
    ['Debt / financing','Loan amount, lender, LTV, DSCR'],
    ['Planning & zoning','Zoning designation, allowed density'],
    ['Permits','Building permit numbers and status'],
    ['Documents','Sale agreements, brochures, T12s'],
    ['Images','Verified exterior/interior photography']
  ];
}
function viewProperty(id){
  var p = byId[id];
  if(!p){ document.getElementById('main').innerHTML = '<div class="panel emptystate">Property '+esc(id)+' not found in the ledger.</div>'; return; }
  var tab = dossierTab[id] || 'overview';
  var dev = p.developerId ? devById[p.developerId] : null;
  var tierInfo = sourceTier(p.source);

// ================= UNDERWRITING (standalone) =================
var calcStore = {};
function getCalcState(key){
  if (!calcStore[key]) calcStore[key] = {
    price: 380000000, rentMonthly: 2500000, vacancy: 8, opex: 22,
    loan: 190000000, rate: 15, amort: 15, hold: 5, exitCap: 8.5, rentGrowth: 4, sellCost: 5
  };
  return calcStore[key];
}
function computeUnderwriting(s){
  var egiAnnual = s.rentMonthly*12*(1-s.vacancy/100);
  var opexAmt = egiAnnual*(s.opex/100);
  var noi = egiAnnual - opexAmt;
  var capRate = s.price>0 ? 100*noi/s.price : 0;
  var monthlyRate = (s.rate/100)/12;
  var nPay = s.amort*12;
  var loanPayment = s.loan>0 ? (monthlyRate===0? s.loan/nPay : s.loan*monthlyRate/(1-Math.pow(1+monthlyRate,-nPay))) : 0;
  var annualDS = loanPayment*12;
  var dscr = annualDS>0 ? noi/annualDS : null;
  var equity = s.price - s.loan;
  var cashFlow = noi - annualDS;
  var coc = equity>0 ? 100*cashFlow/equity : null;
  // amortization schedule to find balance at exit
  var bal = s.loan; var cfArr=[-equity];
  var noiY = noi;
  for (var y=1;y<=s.hold;y++){
    var interestYear=0, principalYear=0, b=bal;
    for (var m=0;m<12;m++){ var interest=b*monthlyRate; var principal=loanPayment-interest; b-=principal; interestYear+=interest; principalYear+=principal; }
    bal = b;
    var yearlyCF = noiY - annualDS;
    cfArr.push(yearlyCF);
    noiY = noiY*(1+s.rentGrowth/100);
  }
  var exitNOI = noiY;
  var exitValue = s.exitCap>0 ? exitNOI/(s.exitCap/100) : 0;
  var sellCosts = exitValue*(s.sellCost/100);
  var netProceeds = exitValue - sellCosts - Math.max(0,bal);
  cfArr[cfArr.length-1] += netProceeds;
  var irr = solveIRR(cfArr);
  var equityMultiple = equity>0 ? (cfArr.slice(1).reduce(function(a,b){return a+b;},0)+equity)/equity : null;
  return {egiAnnual:egiAnnual, opexAmt:opexAmt, noi:noi, capRate:capRate, loanPayment:loanPayment, annualDS:annualDS,
    dscr:dscr, equity:equity, cashFlow:cashFlow, coc:coc, exitValue:exitValue, netProceeds:netProceeds, irr:irr, equityMultiple:equityMultiple};
}
function solveIRR(cf){
  var lo=-0.99, hi=3.0;
  function npv(r){ return cf.reduce(function(a,v,i){ return a+v/Math.pow(1+r,i); },0); }
  if (npv(lo)*npv(hi) > 0) return null;
  for (var i=0;i<80;i++){ var mid=(lo+hi)/2; if (npv(lo)*npv(mid)<=0) hi=mid; else lo=mid; }
  return (lo+hi)/2*100;
}
function scenarioSet(base){
  function mod(rentPct, vacDelta, capDelta){
    var s = Object.assign({}, base);
    s.rentMonthly = base.rentMonthly*(1+rentPct/100);
    s.vacancy = base.vacancy + vacDelta;
    s.exitCap = base.exitCap + capDelta;
    return computeUnderwriting(s);
  }
  return {
    Base: mod(0,0,0),
    Upside: mod(10,-2,-0.5),
    Downside: mod(-10,3,0.5),
    Stress: mod(-20,10,1.5)
  };
}
function calcInputsHTML(key, s){
  var fields = [
    ['price','Purchase price (RWF)'],['rentMonthly','Gross monthly rent (RWF)'],['vacancy','Vacancy (%)'],
    ['opex','Operating expenses (% of EGI)'],['loan','Loan amount (RWF)'],['rate','Interest rate (%/yr)'],
    ['amort','Amortization (years)'],['hold','Holding period (years)'],['exitCap','Exit cap rate (%)'],
    ['rentGrowth','Rent growth (%/yr)'],['sellCost','Selling costs (%)']
  ];
  var html = '<div class="section-title">Assumptions — edit and the model recalculates</div>';
  fields.forEach(function(f){
    html += '<div style="margin-bottom:9px;"><label class="field">'+f[1]+'</label><input type="number" value="'+s[f[0]]+'" oninput="REJA.updateCalc(\''+key+'\',\''+f[0]+'\',this.value)"></div>';
  });
  return html;
}
function calcResultsHTML(r){
  var html = '<div class="section-title">Reactive underwriting output</div>';
  var lines = [
    ['Effective gross income / yr', fmtNum(r.egiAnnual)+' RWF'],
    ['Operating expenses / yr', fmtNum(r.opexAmt)+' RWF'],
    ['NOI / yr', fmtNum(r.noi)+' RWF'],
    ['Cap rate', fmtPct(r.capRate,2)],
    ['Annual debt service', fmtNum(r.annualDS)+' RWF'],
    ['DSCR', r.dscr!==null? r.dscr.toFixed(2)+'x' : '—'],
    ['Equity required', fmtNum(r.equity)+' RWF'],
    ['Year-1 cash flow', fmtNum(r.cashFlow)+' RWF'],
    ['Cash-on-cash', r.coc!==null?fmtPct(r.coc,2):'—'],
    ['Modelled exit value', fmtNum(r.exitValue)+' RWF'],
    ['Net sale proceeds', fmtNum(r.netProceeds)+' RWF'],
    ['Equity multiple', r.equityMultiple!==null?r.equityMultiple.toFixed(2)+'x':'—'],
    ['IRR', r.irr!==null?fmtPct(r.irr,1):'no solution in range']
  ];
  lines.forEach(function(l){ html += '<div class="result-line"><span class="l">'+l[0]+'</span><span class="v">'+l[1]+'</span></div>'; });
  if (r.dscr!==null && r.dscr<1.2) html += '<div class="callout bad" style="margin-top:10px;">LOW DSCR — debt service coverage below a typical 1.2x lending threshold at these assumptions.</div>';
  return html;
}
function calcScenarioHTML(s){
  var sc = scenarioSet(s);
  var html = '<div class="hr"></div><div class="section-title">Scenario matrix</div><table class="scenario-table"><thead><tr><th>Scenario</th><th>IRR</th><th>DSCR</th><th>Cap rate</th></tr></thead><tbody>';
  ['Base','Upside','Downside','Stress'].forEach(function(k){
    var r = sc[k];
    html += '<tr><td>'+k+'</td><td>'+(r.irr!==null?fmtPct(r.irr,1):'—')+'</td><td>'+(r.dscr!==null?r.dscr.toFixed(2)+'x':'—')+'</td><td>'+fmtPct(r.capRate,2)+'</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}
function viewUnderwriting(){
  var html = '<div class="pagehead"><div><h1>Underwriting Model</h1><div class="desc">A standalone reactive acquisition model. Open it from any property dossier to attach it to that asset, or run it freestanding here.</div></div></div>';
  html += renderUnderwritingPanel({id:'__standalone__'});
  document.getElementById('main').innerHTML = html;
}

// ================= CASES / INVESTIGATIONS =================
function viewCases(){
  var html = '<div class="pagehead"><div><h1>Investigations</h1><div class="desc">Session watchlists and due-diligence cases. This prototype keeps them in memory for the current session only — a production build would persist these per analyst account.</div></div>' +
    '<button class="btn primary" onclick="REJA.newCase()">New case</button></div>';

  html += '<div class="grid g2">';
  html += '<div class="panel"><div class="section-title">Property watchlist ('+STATE.watchProps.length+')</div>';
  if (!STATE.watchProps.length) html += '<div class="emptystate">Empty.</div>';
  STATE.watchProps.forEach(function(id){ var p=byId[id]; if(!p) return;
    html += '<div class="node-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div onclick="location.hash=\'#/property/'+id+'\'"><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(p.district)+'</div></div>' +
      '<button class="btn small ghost" onclick="REJA.toggleWatch(\''+id+'\');REJA.render();">remove</button></div>';
  });
  html += '</div>';
  html += '<div class="panel"><div class="section-title">Developer watchlist ('+STATE.watchDevs.length+')</div>';
  if (!STATE.watchDevs.length) html += '<div class="emptystate">Empty.</div>';
  STATE.watchDevs.forEach(function(id){ var d=devById[id]; if(!d) return;
    html += '<div class="node-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div onclick="location.hash=\'#/developer/'+id+'\'"><div class="t">'+esc(d.name)+'</div><div class="s">'+d.projectCount+' projects</div></div>' +
      '<button class="btn small ghost" onclick="REJA.toggleWatchDev(\''+id+'\');REJA.render();">remove</button></div>';
  });
  html += '</div></div>';

  html += '<div class="panel" style="margin-top:14px;"><div class="section-title">Case files ('+STATE.cases.length+')</div>';
  if (!STATE.cases.length) html += '<div class="emptystate">No open cases. Start one from a property or developer dossier, or use "New case" above.</div>';
  STATE.cases.forEach(function(c){
    var done = c.tasks.filter(function(t){return t.status==='Verified';}).length;
    html += '<div class="panel" style="background:var(--panel-2);margin-bottom:12px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
      '<div><div style="font-weight:700;">CASE '+c.id+' — '+esc(c.title)+'</div><div style="font-size:11px;color:var(--ink-faint);">Target: '+esc(c.targetLabel)+' · '+done+'/'+c.tasks.length+' checks verified</div></div>' +
      '<div style="display:flex;gap:6px;"><button class="btn small" onclick="REJA.exportCase(\''+c.id+'\')">Export JSON</button><select onchange="REJA.setCaseConclusion(\''+c.id+'\',this.value)" style="width:170px;">' +
      ['','Proceed','Proceed with conditions','Monitor','Reject'].map(function(o){return '<option '+(c.conclusion===o?'selected':'')+'>'+o+'</option>';}).join('') + '</select></div></div>';
    html += '<div class="hr" style="margin:10px 0;"></div>';
    c.tasks.forEach(function(t,ti){
      html += '<div class="checklist-item"><div style="flex:1;">'+esc(t.label)+'</div><select onchange="REJA.setTaskStatus(\''+c.id+'\','+ti+',this.value)">' +
        ['Pending','Verified','Failed','Not applicable'].map(function(o){return '<option '+(t.status===o?'selected':'')+'>'+o+'</option>';}).join('') + '</select></div>';
    });
    html += '<div style="margin-top:8px;"><label class="field">Case notes</label><textarea rows="2" oninput="REJA.setCaseNotes(\''+c.id+'\',this.value)">'+esc(c.notes||'')+'</textarea></div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

// ================= ABOUT =================
function viewAbout(){
  var html = '<div class="pagehead"><div><h1>About this build</h1><div class="desc">What is real here, what is a modelled placeholder, and what a production version of Reja still needs.</div></div></div>';
  html += '<div class="panel"><div class="section-title">What is implemented in this prototype</div>' +
    '<ul style="margin:0;padding-left:18px;line-height:1.9;font-size:12.5px;color:var(--ink-soft);">' +
    '<li>All 60 logged projects and 20 developers migrated from the original ledger, each given a permanent entity ID (property/developer), field-level provenance, and a source-tier classification.</li>' +
    '<li>Data confidence and risk scores computed transparently from the actual completeness/ambiguity of each record — every score shows its reasoning.</li>' +
    '<li>Ownership grouping, a structural comparables engine, a connections graph, and a due-diligence case workflow, all built on the real fields in the ledger.</li>' +
    '<li>A fully reactive financial underwriting model (NOI, cap rate, DSCR, cash-on-cash, IRR, exit, and a Base/Upside/Downside/Stress scenario matrix) — driven entirely by assumptions you enter, never by invented prices.</li>' +
    '<li>A structured query parser for property search that recognises district, status, risk, unit-count, confidence, and developer terms in free text.</li>' +
    '</ul></div>';
  html += '<div class="panel"><div class="section-title">Explicitly not real — needs a production backend</div>' +
    '<ul style="margin:0;padding-left:18px;line-height:1.9;font-size:12.5px;color:var(--ink-soft);">' +
    '<li>No parcel, unit-level, rent-roll, transaction, valuation, debt, permit, or document data exists yet for any asset — each dossier labels these NOT IN DB rather than fabricating figures.</li>' +
    '<li>No real photography is shown anywhere — every image slot says IMAGE NOT AVAILABLE, per the platform\u2019s own rule against inventing evidence.</li>' +
    '<li>Watchlists and case files live only in this browser tab\u2019s memory and are lost on refresh — a real deployment needs a database, authentication, and audit logging (see spec sections 47\u201349).</li>' +
    '<li>Natural-language search here is a keyword/pattern parser, not an LLM-to-query pipeline; document AI, ingestion pipelines, and automated conflict detection across multiple sources are unbuilt.</li>' +
    '<li>No live market time series (price/sqm, rent, absorption) exists — Market Intelligence shows an honest DATA GAP instead of guessed numbers.</li>' +
    '</ul></div>';
  html += '<div class="panel"><div class="section-title">Sources on file ('+SOURCES.length+')</div><table class="datatable"><thead><tr><th>Source</th><th>Publisher</th><th>Use</th></tr></thead><tbody>' +
    SOURCES.map(function(s){ return '<tr><td>'+esc(s.source)+'</td><td>'+esc(s.publisher)+'</td><td style="color:var(--ink-faint);">'+esc(s.use)+'</td></tr>'; }).join('') + '</tbody></table></div>';
  document.getElementById('main').innerHTML = html;
}

// ================= ROUTER =================
function render(){
  var hash = location.hash || '#/home';
  var parts = hash.replace('#/','').split('/');
  var route = parts[0];
  var activeNav = '#/'+route;
  if (route==='property' || route==='developer') activeNav = route==='property' ? '#/search' : '#/developers';
  if (route==='' ) { route='home'; activeNav='#/home'; }
  renderNav(activeNav);
  window.scrollTo(0,0);
  if (route==='home') viewHome();
  else if (route==='search') viewSearch();
  else if (route==='property') viewProperty(decodeURIComponent(parts[1]));
  else if (route==='developer') viewDeveloper(decodeURIComponent(parts[1]));
  else if (route==='developers') viewDevelopersList();
  else if (route==='market') viewMarket();
  else if (route==='graph') viewGraph(parts[1] ? decodeURIComponent(parts[1]) : null);
  else if (route==='underwriting') viewUnderwriting();
  else if (route==='cases') viewCases();
  else if (route==='about') viewAbout();
  else viewHome();
}

// ================= public API used by inline handlers =================
window.REJA = {
  render: render,
  goSearchFromHome: function(){ var q = document.getElementById('homeSearch').value; searchState.q=q; go('#/search'); },
  goSearchDistrict: function(d){ searchState.q = d; go('#/search'); },
  sortBy: function(k){ if (searchState.sortKey===k) searchState.sortDir*=-1; else { searchState.sortKey=k; searchState.sortDir=1; } viewSearch(searchState.q); },
  exportCSV: function(){
    var parsed = parseQuery(searchState.q);
    var rows = applyFilters(PROJECTS.slice(), parsed);
    var cols = ['id','name','district','sector','assetClass','developerName','ownerName','status','units','land_ha','start','completion','riskLevel','riskScore','dataConfidence','source'];
    var csv = cols.join(',')+'\n' + rows.map(function(p){ return cols.map(function(c){ var v=p[c]; v = (v===null||v===undefined)?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reja_export.csv'; a.click();
  },
  setTab: function(id, tab){ dossierTab[id]=tab; viewProperty(id); },
  toggleWatch: function(id){ var i=STATE.watchProps.indexOf(id); if(i>=0) STATE.watchProps.splice(i,1); else STATE.watchProps.push(id); render(); },
  toggleWatchDev: function(id){ var i=STATE.watchDevs.indexOf(id); if(i>=0) STATE.watchDevs.splice(i,1); else STATE.watchDevs.push(id); render(); },
  centerGraph: function(id){ go('#/graph/'+id); },
  updateCalc: function(key, field, val){
    var s=getCalcState(key); s[field]=parseFloat(val)||0;
    var out = document.getElementById('calcOut-'+key);
    if (out) out.innerHTML = calcOutHTML(key);
  },
  newCaseFor: function(targetId, targetType){
    var label = targetType==='property' ? byId[targetId].name : devById[targetId].name;
    var c = { id: 'RW-CASE-2026-'+String(STATE.caseSeq++).padStart(4,'0'), title: 'Diligence on '+label, targetId:targetId, targetType:targetType, targetLabel:label,
      conclusion:'', notes:'', tasks: DEFAULT_DD.map(function(l){ return {label:l, status:'Pending'}; }) };
    STATE.cases.push(c); go('#/cases');
  },
  newCase: function(){
    var label = prompt('Case subject (free text):','New investigation');
    if (label===null) return;
    var c = { id: 'RW-CASE-2026-'+String(STATE.caseSeq++).padStart(4,'0'), title: label||'Untitled case', targetId:null, targetType:null, targetLabel:label||'—',
      conclusion:'', notes:'', tasks: DEFAULT_DD.map(function(l){ return {label:l, status:'Pending'}; }) };
    STATE.cases.push(c); render();
  },
  setTaskStatus: function(caseId, ti, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.tasks[ti].status=val; },
  setCaseNotes: function(caseId, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.notes=val; },
  setCaseConclusion: function(caseId, val){ var c = STATE.cases.find(function(x){return x.id===caseId;}); if(c) c.conclusion=val; },
  exportCase: function(caseId){
    var c = STATE.cases.find(function(x){return x.id===caseId;});
    var blob = new Blob([JSON.stringify(c,null,2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = caseId+'.json'; a.click();
  }
};

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
})();
</script>
